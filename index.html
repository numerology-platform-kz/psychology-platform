<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="manifest" href="manifest.json?v=1">
<link rel="icon" href="favicon.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="theme-color" content="#0E1A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Psychology Platform">
<style>
:root {
  --page: #0B1530;
  --side: #0A1430;
  --main: #0E1A3A;
  --card: #16244D;
  --card2: #1B2B5A;
  --line: rgba(244, 165, 130, 0.55);
  --line-soft: rgba(244, 165, 130, 0.25);
  --coral: #F4A582;
  --coral2: #E8826A;
  --cream: #FCE3D6;
  --text: #DCE2F4;
  --muted: #8C97B8;
  --ok: #8fe3b0;
  --bad: #ff9d9d;
  --track: rgba(255,255,255,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  background:
    radial-gradient(circle at 70% 15%, rgba(244, 165, 130, 0.10), transparent 30%),
    radial-gradient(circle at 20% 85%, rgba(70, 100, 190, 0.18), transparent 32%),
    linear-gradient(135deg, #08112a 0%, #0E1A3A 45%, #08112a 100%);
  color: var(--text);
  font-family: Arial, sans-serif;
  visibility: hidden;
}
body, body * { font-variant-numeric: lining-nums; }

/* ===================== ПЛАТФОРМА ===================== */
.platform { min-height: 100vh; display: flex; padding: 8px; }

.sidebar {
  width: 260px; min-height: calc(100vh - 16px); padding: 28px 18px 24px;
  border: 1px solid var(--line); border-radius: 18px 0 0 18px;
  background:
    radial-gradient(circle at 50% 8%, rgba(244, 165, 130, 0.12), transparent 30%),
    linear-gradient(180deg, #0D1938 0%, var(--side) 100%);
  display: flex; flex-direction: column;
}
.logo { text-align: center; margin-bottom: 34px; cursor: pointer; }
.logo-symbol {
  width: 104px; height: 104px; margin: 0 auto 14px; border-radius: 50%;
  border: 2px solid var(--coral); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 22px rgba(244, 165, 130, 0.30), inset 0 0 20px rgba(244, 165, 130, 0.10);
}
.logo-title { font-family: PT Serif, Georgia, serif; font-size: 23px; color: var(--cream); letter-spacing: 1.5px; }
.logo-subtitle { margin-top: 6px; font-size: 19px; color: var(--coral); }

.nav { display: flex; flex-direction: column; gap: 10px; }
.nav-item {
  width: 100%; min-height: 50px; padding: 13px 14px; border-radius: 12px;
  border: 1px solid transparent; background: transparent; color: var(--text);
  font-size: 17px; line-height: 1.2; text-align: left; cursor: pointer;
  transition: background .25s, border-color .25s, color .25s;
  display: flex; align-items: center;
}
.nav-item:hover { background: rgba(244, 165, 130, 0.10); border-color: var(--line-soft); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(244, 165, 130, 0.22), rgba(232, 130, 106, 0.10));
  border-color: var(--coral); color: var(--cream);
}
.nav-icon { display: inline-flex; width: 32px; min-width: 32px; margin-right: 4px; align-items: center; justify-content: center; font-size: 20px; }
.logout { margin-top: auto; color: var(--coral); }

.main {
  flex: 1; min-width: 0; min-height: calc(100vh - 16px); padding: 42px 30px 36px;
  border: 1px solid var(--line); border-left: none; border-radius: 0 18px 18px 0;
  background:
    radial-gradient(circle at 55% 4%, rgba(244, 165, 130, 0.08), transparent 30%),
    radial-gradient(circle at 92% 88%, rgba(70, 100, 190, 0.14), transparent 30%),
    var(--main);
}
.top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; gap: 20px; }
.welcome h1 { margin: 0; font-family: PT Serif, Georgia, serif; font-size: 40px; font-weight: 500; color: var(--cream); }
.welcome-sub { margin-top: 8px; color: var(--muted); font-size: 15px; }
.account { display: flex; align-items: center; gap: 12px; color: var(--text); font-size: 15px; }
.account-icon {
  width: 44px; height: 44px; border: 1px solid var(--coral); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: var(--coral); font-size: 20px;
}

/* Карточки разделов */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; width: 100%; }
.card {
  min-height: 220px; padding: 22px 16px; border: 1px solid var(--line); border-radius: 18px;
  background: radial-gradient(circle at 50% 10%, rgba(244, 165, 130, 0.12), transparent 45%), linear-gradient(145deg, var(--card2) 0%, var(--card) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  cursor: pointer; transition: transform .25s, box-shadow .25s;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 35px rgba(0, 0, 0, 0.28), 0 0 22px rgba(244, 165, 130, 0.12); }
.card-icon { font-size: 46px; line-height: 1; margin-bottom: 14px; }
.card h3 { margin: 0 0 8px; font-family: PT Serif, Georgia, serif; font-size: 20px; font-weight: 500; color: var(--cream); line-height: 1.15; }
.card p { margin: 0; font-size: 14px; line-height: 1.35; color: var(--muted); }
.card.locked { opacity: .65; }
.card .lock-note { margin-top: 10px; font-size: 12px; color: var(--coral); }

/* Дашборд */
.dashboard-wrap { width: 100%; }
.dashboard-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
.dashboard-head h2 { margin: 0 0 8px; font-family: PT Serif, Georgia, serif; font-size: 31px; font-weight: 500; color: var(--cream); }
.dashboard-head p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
.dashboard-badge { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; color: var(--coral); background: rgba(255,255,255,.04); white-space: nowrap; }
.table-card { border: 1px solid var(--line-soft); border-radius: 16px; background: linear-gradient(145deg, rgba(27,43,90,.85), rgba(22,36,77,.85)); padding: 18px; overflow-x: auto; }
.table-title { color: var(--cream); font-family: PT Serif, Georgia, serif; font-size: 21px; margin-bottom: 14px; }
.data-table { width: 100%; border-collapse: collapse; color: var(--text); }
.data-table th, .data-table td { padding: 11px 10px; border-bottom: 1px solid rgba(244,165,130,.14); text-align: left; vertical-align: middle; }
.data-table th { color: var(--coral); font-weight: 600; font-size: 14px; }
.empty-table { padding: 28px 10px; color: var(--muted); text-align: center; line-height: 1.5; }
.access-locked { width: 100%; text-align: center; padding: 50px 24px; }
.access-locked-icon { font-size: 52px; margin-bottom: 14px; }
.access-locked h2 { font-family: PT Serif, Georgia, serif; font-size: 26px; font-weight: 500; color: var(--cream); margin: 0 0 12px; }
.access-locked p { font-size: 16px; color: var(--text); line-height: 1.6; max-width: 620px; margin: 0 auto; }

.btn {
  display: inline-block; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--coral);
  background: linear-gradient(90deg, var(--coral), var(--coral2)); color: #0A1430;
  font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:disabled { opacity: .55; cursor: wait; }
.btn-ghost { background: transparent; color: var(--coral); font-weight: 400; }
.btn-small { padding: 6px 11px; font-size: 12px; font-weight: 500; }
.btn-danger { background: #8e2f3a; border-color: #b8505c; color: #fde; }
.input {
  width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--line-soft);
  background: rgba(0,0,0,.22); color: #fff; outline: none; font-size: 15px;
}
.input:focus { border-color: var(--coral); }
.input::placeholder { color: #7e89aa; }
select.input option { background: #0E1A3A; color: #fff; }
.msg { margin-top: 10px; min-height: 20px; line-height: 1.4; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--bad); }
.section-intro { color: var(--muted); font-size: 16px; line-height: 1.6; max-width: 760px; margin: -8px 0 22px; }
.check-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.check-label input { accent-color: var(--coral); width: 16px; height: 16px; }

/* Трекер привычек */
.tracker-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.tracker-tab { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.03); color: var(--text); cursor: pointer; font-size: 15px; }
.tracker-tab.active { background: rgba(244,165,130,.18); border-color: var(--coral); color: var(--cream); }
.tracker-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.week-nav { display: flex; align-items: center; gap: 12px; color: var(--cream); font-size: 20px; font-family: PT Serif, Georgia, serif; }
.week-nav span { min-width: 170px; text-align: center; }
.week-nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--coral); font-size: 18px; cursor: pointer; font-family: Arial, sans-serif; }
.tracker-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.month-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
.month-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 860px; color: var(--text); font-size: 12px; }
.month-table th, .month-table td { border-bottom: 1px solid rgba(244,165,130,.14); text-align: center; padding: 6px 0; }
.month-table th { color: var(--coral); font-weight: 600; line-height: 1.25; }
.month-table th span { display: block; font-weight: 400; color: var(--muted); font-size: 10px; }
.month-table th.today, .month-table td.today { background: rgba(244,165,130,.13); }
.month-table th.today span { color: var(--cream); }
.month-table .we { background: rgba(255,255,255,.035); }
.month-table .mt-name { text-align: left; min-width: 115px; max-width: 180px; padding: 6px 10px 6px 4px; position: sticky; left: 0; z-index: 1; background: #17264f; color: var(--cream); font-size: 14px; word-break: break-word; }
.month-table th.mt-name { color: var(--coral); font-size: 13px; }
.month-table .mt-total { min-width: 46px; color: var(--cream); font-size: 13px; padding: 6px 4px; }
.month-table .mt-total small { display: block; color: var(--coral); font-size: 11px; }
.month-table tfoot td { color: var(--muted); font-size: 11px; border-bottom: none; }
.mcell {
  width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); background: transparent;
  cursor: pointer; color: #0A1430; font-size: 13px; font-weight: 700; padding: 0; line-height: 1;
}
.mcell:hover { border-color: var(--coral); }
.mcell.done { background: linear-gradient(135deg, var(--coral), var(--coral2)); border-color: var(--coral); }
.mcell:disabled { opacity: .22; cursor: default; }
.habit-del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 4px; }
.habit-del:hover { color: var(--bad); }
.habit-add { display: flex; gap: 10px; margin-top: 16px; max-width: 560px; }
.month-flip { display: flex; align-items: stretch; gap: 8px; }
.month-flip .month-wrap { flex: 1; min-width: 0; }
.flip-btn { flex: 0 0 38px; border-radius: 12px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.03); color: var(--coral); cursor: pointer; font-size: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 6px 0; }
.flip-btn:hover { border-color: var(--coral); background: rgba(244,165,130,.10); }
.flip-btn span { font-size: 11px; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); letter-spacing: .5px; }
.scroll-hint { display: none; color: var(--muted); font-size: 13px; margin: 0 0 8px; }

/* Вес и ИМТ */
.body-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-bottom: 18px; }
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.form-row span { font-size: 14px; color: var(--muted); }
.form-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.stat-box { border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px; background: rgba(255,255,255,.03); }
.stat-box span { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.stat-box strong { display: block; color: var(--cream); font-size: 26px; font-family: PT Serif, Georgia, serif; font-weight: 500; }
.stat-box em { display: block; font-style: normal; font-size: 13px; margin-top: 4px; color: var(--coral); }
.stat-box.recommended { border-color: var(--coral); background: rgba(244,165,130,.10); }
.bmi-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; margin-top: 6px; }
.bmi-table tr.current td { background: rgba(244,165,130,.16); color: var(--cream); font-weight: 600; }
.bmi-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }
.weight-list { max-height: 260px; overflow-y: auto; }
.note-small { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 10px; }

.section-note { color: var(--muted); font-size: 14px; margin: 0 0 14px; line-height: 1.5; }
.chart-svg { width: 100%; height: auto; display: block; }
.mini-input { width: 90px; padding: 7px 9px; }

/* Настроение */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 620px; }
.cal-head { text-align: center; color: var(--coral); font-size: 13px; font-weight: 600; padding: 4px 0; }
.cal-cell { aspect-ratio: 1 / 1; min-height: 50px; border-radius: 10px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.03); color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 2px; }
.cal-cell.empty { border: none; background: none; cursor: default; }
.cal-cell.today { box-shadow: 0 0 0 2px var(--coral) inset; }
.cal-cell:disabled { opacity: .35; cursor: default; }
.cal-num { font-size: 12px; color: var(--muted); }
.cal-emoji { font-size: 22px; line-height: 1; min-height: 22px; }
.cal-note-dot { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.mood-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 13px; color: var(--text); }
.mood-pick { display: grid; gap: 8px; margin: 14px 0; }
.mood-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); color: var(--text); cursor: pointer; font-size: 15px; text-align: left; }
.mood-btn span { font-size: 24px; }
.mood-btn.sel { border-color: var(--mc); background: rgba(244,165,130,.16); color: #fff; box-shadow: 0 0 0 1px var(--mc) inset; }

/* Сон и вода */
.water-ctrl { display: flex; align-items: center; gap: 8px; }
.water-ctrl button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--coral); font-size: 17px; cursor: pointer; padding: 0; }
.water-ctrl button:disabled { opacity: .3; cursor: default; }
.water-ctrl b { min-width: 22px; text-align: center; color: var(--cream); }
.water-drops { font-size: 12px; letter-spacing: -2px; }

/* Колесо баланса */
.wheel-wrap { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.1fr); gap: 24px; align-items: start; }
.wheel-row { display: grid; grid-template-columns: 130px 1fr 28px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
.wheel-row input[type=range] { accent-color: var(--coral); width: 100%; }
.wheel-row b { color: var(--cream); text-align: right; }

/* Челленджи */
.ch-card { border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px; margin-bottom: 14px; background: rgba(255,255,255,.03); break-inside: avoid; }
.ch-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ch-title { color: var(--cream); font-size: 17px; }
.ch-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
.ch-grid { display: grid; grid-template-columns: repeat(7, minmax(34px, 1fr)); gap: 6px; margin-top: 12px; max-width: 420px; }
.ch-day { height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1.1; padding: 0; }
.ch-day.done { background: linear-gradient(135deg, var(--coral), var(--coral2)); color: #0A1430; border-color: var(--coral); font-weight: 700; }
.ch-day:disabled { opacity: .3; cursor: default; }
.progress { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 10px; max-width: 420px; }
.progress div { height: 100%; background: linear-gradient(90deg, var(--coral), var(--coral2)); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line-soft); background: rgba(255,255,255,.04); color: var(--text); cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--coral); }

/* Благодарность */
.grat-day { border-bottom: 1px solid rgba(244,165,130,.14); padding: 10px 0; break-inside: avoid; }
.grat-day b { color: var(--coral); font-size: 13px; }
.grat-day ol { margin: 6px 0 0; padding-left: 20px; color: var(--text); line-height: 1.6; }

@media (max-width: 800px) { .wheel-wrap { grid-template-columns: 1fr; } }
@media (max-width: 520px) {
  .cal-grid { gap: 4px; }
  .cal-cell { min-height: 40px; border-radius: 8px; }
  .cal-emoji { font-size: 18px; min-height: 18px; }
  .wheel-row { grid-template-columns: 105px 1fr 24px; font-size: 13px; }
}

/* Скачивание PDF (печать) */
.print-title { display: none; }
@page { size: A4; margin: 12mm; }
@page landscape { size: A4 landscape; margin: 10mm; }
@media print {
  :root { --cream: #1d1d1d; --text: #222; --muted: #666; --line: #c8c8c8; --line-soft: #dcdcdc; --track: #eee; --coral: #c9654b; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #fff !important; color: #222 !important; }
  .sidebar, .no-print, #welcomeTop, .dashboard-head, .tracker-tabs, #trackerMsg, .habit-del, .msg, .scroll-hint { display: none !important; }
  .platform, .main { display: block !important; padding: 0 !important; border: none !important; background: #fff !important; min-height: 0 !important; }
  .table-card { border: none !important; background: #fff !important; padding: 0 !important; overflow: visible !important; }
  .stat-box, .ch-card, .cal-cell { background: #fff !important; }
  .stat-box { border: 1px solid #ccc !important; break-inside: avoid; }
  .print-title { display: block !important; color: #1d1d1d; font-family: PT Serif, Georgia, serif; font-size: 20px; margin: 0 0 12px; }
  .print-landscape { page: landscape; }
  svg, .stat-row, .cal-grid { break-inside: avoid; }
  .data-table th, .data-table td { color: #222 !important; border-color: #ccc !important; }
  .month-wrap { overflow: visible; }
  .month-table { min-width: 0; color: #222; }
  .month-table th, .month-table td { border: 1px solid #bbb; color: #222 !important; background: #fff !important; }
  .month-table .mt-name { position: static; background: #fff !important; color: #222 !important; }
  .month-table th span, .month-table .mt-total small { color: #555 !important; }
  .mcell { border-color: #999; width: 18px; height: 18px; }
  .mcell.done { background: #E8826A !important; }
  .mcell:disabled { opacity: 1; }
  .ch-day:disabled { opacity: 1; }
}

/* Авторизация */
.auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px 16px; }
.auth-card {
  width: 420px; max-width: 100%; padding: 36px 32px; border: 1px solid var(--line); border-radius: 20px;
  background: linear-gradient(145deg, var(--card2), var(--card)); box-shadow: 0 20px 70px rgba(0,0,0,.4); text-align: center;
}
.auth-card-register { width: 600px; }
.auth-logo { width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid var(--coral); display: flex; align-items: center; justify-content: center; }
.auth-title { font-family: PT Serif, Georgia, serif; font-size: 25px; color: var(--cream); letter-spacing: 1.5px; }
.auth-subtitle { color: var(--coral); margin-top: 4px; margin-bottom: 20px; }
.auth-card h2 { color: var(--cream); font-family: PT Serif, Georgia, serif; font-weight: 500; }
.auth-card input {
  width: 100%; padding: 13px; margin: 6px 0; border: 1px solid var(--line-soft); border-radius: 10px;
  background: rgba(0,0,0,.22); color: #fff; font-size: 16px; outline: none;
}
.auth-card input:focus { border-color: var(--coral); }
.auth-card .btn { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; }

/* ============================================================

const WEEKDAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
let trackerTab = "habits";

let trackerHabits = [];

function isoDay(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function monthDays(first) {
  const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return Array.from({ length: n }, (_, i) => new Date(first.getFullYear(), first.getMonth(), i + 1));
}
function daysWord(n) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "день";
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "дня";
  return "дней";
}
function fmtNum(v, digits) { return Number(v).toLocaleString("ru-RU", { maximumFractionDigits: digits == null ? 1 : digits }); }
function parseNum(v) { const n = parseFloat(String(v || "").replace(",", ".").trim()); return isFinite(n) ? n : NaN; }

/* Графики */
function shortLabel(t, n) { t = String(t || ""); return t.length > n ? t.slice(0, n - 1) + "…" : t; }
function hBarChartSvg(items, opts) {
  opts = opts || {};
  const max = opts.max || Math.max(1, ...items.map(i => i.value));
  const W = 680, rowH = 32, labelW = opts.labelW || 210, barW = W - labelW - 70, H = items.length * rowH + 6;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="max-width:${W}px;">
    ${items.map((it, i) => {
      const y = i * rowH + 4, w = Math.max(0, barW * Math.min(it.value, max) / max);
      return `<text x="0" y="${y + 18}" style="fill:var(--text);font-size:13px;">${escapeHtml(shortLabel(it.label, 30))}</text>
        <rect x="${labelW}" y="${y + 5}" width="${barW}" height="18" rx="5" style="fill:var(--track);"/>
        <rect x="${labelW}" y="${y + 5}" width="${w}" height="18" rx="5" fill="${it.color || "#F4A582"}"/>
        <text x="${labelW + w + 8}" y="${y + 18}" style="fill:var(--cream);font-size:13px;">${escapeHtml(opts.fmt ? opts.fmt(it.value) : String(it.value))}</text>`;
    }).join("")}
  </svg>`;
}
function dayBarsSvg(days, values, opts) {
  const W = 760, H = 200, pl = 34, pr = 8, pt = 12, pb = 24;
  const n = days.length, bw = (W - pl - pr) / n;
  const max = Math.max(opts.max, ...values);
  const y = v => pt + (1 - v / max) * (H - pt - pb);
  const grid = [0, max / 2, max].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line-soft);" stroke-width="0.6"/>
    <text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px;">${fmtNum(Math.round(v * 10) / 10)}</text>`).join("");
  const norms = (opts.norms || []).map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#8fe3b0" stroke-width="1.4" stroke-dasharray="5 4"/>`).join("");
  const bars = values.map((v, i) => v > 0 ? `<rect x="${pl + i * bw + 1.5}" y="${y(v)}" width="${Math.max(2, bw - 3)}" height="${H - pb - y(v)}" rx="3" fill="${opts.color}"><title>${days[i].getDate()}: ${fmtNum(v)} ${opts.unit || ""}</title></rect>` : "").join("");
  const labels = days.map((d, i) => `<text x="${pl + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" style="fill:var(--muted);font-size:9px;">${d.getDate()}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">${grid}${bars}${norms}${labels}</svg>`;
}


async function loadTrackerData() {
  const uid = window.currentUserId;
  const days = monthDays(trackerMonth);
  const prev = new Date(trackerMonth.getFullYear(), trackerMonth.getMonth() - 1, 1);
  const [{ data: habits, error: e1 }, { data: checks, error: e2 }, { data: prevH }] = await Promise.all([
    supabaseClient.from("habits").select("id, title, sort_order, created_at").eq("user_id", uid).eq("month", monthKey(trackerMonth)).order("sort_order").order("created_at"),
    supabaseClient.from("habit_checks").select("habit_id, day").eq("user_id", uid).gte("day", isoDay(days[0])).lte("day", isoDay(days[days.length - 1])),
    supabaseClient.from("habits").select("title, sort_order").eq("user_id", uid).eq("month", monthKey(prev)).order("sort_order")
  ]);
  if (e1 || e2) console.error("Ошибка загрузки трекера:", e1 || e2);
  trackerHabits = habits || [];
  trackerChecks = new Set((checks || []).map(c => c.habit_id + "|" + c.day));
  prevMonthHabits = prevH || [];
}

function drawTracker() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const days = monthDays(trackerMonth);
  const todayIso = isoDay(new Date());
  const passed = days.filter(d => isoDay(d) <= todayIso).length; // сколько дней месяца уже наступило
  const monthTitle = MONTHS[trackerMonth.getMonth()] + " " + trackerMonth.getFullYear();
  const prevName = MONTHS[(trackerMonth.getMonth() + 11) % 12].toLowerCase();

  const head = days.map(d => {
    const wd = (d.getDay() + 6) % 7;
    const cls = [wd >= 5 ? "we" : "", isoDay(d) === todayIso ? "today" : ""].join(" ");
    return `<th class="${cls}">${d.getDate()}<span>${WEEKDAYS[wd]}</span></th>`;
  }).join("");

  const rows = trackerHabits.map(h => {
    const done = days.filter(d => trackerChecks.has(h.id + "|" + isoDay(d))).length;
    const pct = passed ? Math.round(done / passed * 100) : 0;
    return `<tr>
      <td class="mt-name">${escapeHtml(h.title)}</td>
      ${days.map(d => {
        const iso = isoDay(d), wd = (d.getDay() + 6) % 7;
        const isDone = trackerChecks.has(h.id + "|" + iso);
        const cls = [wd >= 5 ? "we" : "", iso === todayIso ? "today" : ""].join(" ");
        return `<td class="${cls}"><button class="mcell${isDone ? " done" : ""}" ${iso > todayIso ? "disabled" : ""}
          onclick='toggleHabitDay(${JSON.stringify(h.id)}, ${JSON.stringify(iso)})' aria-label="${d.getDate()} число">${isDone ? "✓" : ""}</button></td>`;
      }).join("")}
      <td class="mt-total">${done}/${passed}<small>${pct}%</small></td>
      <td><button class="habit-del" title="Удалить привычку" onclick='deleteHabit(${JSON.stringify(h.id)}, ${JSON.stringify(h.title)})'>×</button></td>
    </tr>`;
  }).join("");

  const foot = trackerHabits.length ? `<tfoot><tr><td class="mt-name" style="font-size:12px;color:var(--muted);">Выполнено за день</td>${days.map(d => {
    const iso = isoDay(d);
    const n = trackerHabits.filter(h => trackerChecks.has(h.id + "|" + iso)).length;
    return `<td>${iso <= todayIso ? n : ""}</td>`;
  }).join("")}<td></td><td></td></tr></tfoot>` : "";

  box.innerHTML = `
    ${printTitleHtml("Трекер привычек")}
    ${monthToolbarHtml("Трекер привычек")}
    ${trackerHabits.length ? `
      <div class="scroll-hint">Листайте таблицу вправо или поверните телефон горизонтально</div>
      <div class="month-flip">
      <button class="flip-btn no-print" onclick="changeTrackerMonth(-1)" aria-label="Предыдущий месяц">‹<span>${MONTHS[(trackerMonth.getMonth() + 11) % 12]}</span></button>
      <div class="month-wrap">
        <table class="month-table">
          <thead><tr><th class="mt-name">Привычка</th>${head}<th class="mt-total">Итог</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
          ${foot}
        </table>
      </div>
      <button class="flip-btn no-print" onclick="changeTrackerMonth(1)" aria-label="Следующий месяц">›<span>${MONTHS[(trackerMonth.getMonth() + 1) % 12]}</span></button>
      </div>` : `<div class="empty-table">На ${monthTitle.toLowerCase()} привычек пока нет. Впишите первую, например «Пить 2 литра воды» или «10 минут чтения»
        ${prevMonthHabits.length ? `<br><br><button class="btn btn-small" onclick="copyPrevMonthHabits()">Перенести привычки из месяца «${prevName}» (${prevMonthHabits.length})</button>` : ""}</div>`}
    ${trackerHabits.length && passed ? `<div class="table-title" style="margin-top:20px;">Выполнение за месяц</div>
      ${hBarChartSvg(trackerHabits.map(h => {
        const done = days.filter(d => trackerChecks.has(h.id + "|" + isoDay(d))).length;
        return { label: h.title, value: Math.round(done / passed * 100) };
      }), { max: 100, fmt: v => v + "%" })}` : ""}
    <div class="habit-add no-print">
      <input id="newHabitInput" class="input" type="text" maxlength="80" placeholder="Новая привычка" onkeydown="if(event.key==='Enter')addHabit()">
      <button class="btn" onclick="addHabit()">Добавить</button>
    </div>
    <div id="trackerMsg" class="msg"></div>`;

  const todayCell = box.querySelector("th.today");
  const wrap = box.querySelector(".month-wrap");
  if (todayCell && wrap && wrap.scrollWidth > wrap.clientWidth) wrap.scrollLeft = Math.max(0, todayCell.offsetLeft - wrap.clientWidth / 2);
}

async function changeTrackerMonth(step, reset) {
  const now = new Date();
  trackerMonth = reset ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(trackerMonth.getFullYear(), trackerMonth.getMonth() + step, 1);
  await renderTrackerTab();
}

async function addHabit() {
  const input = document.getElementById("newHabitInput");
  const title = (input?.value || "").trim();
  if (!title) { setMsgEl("trackerMsg", "Введите название привычки", false); return; }
  const { error } = await supabaseClient.from("habits").insert({ user_id: window.currentUserId, title, month: monthKey(trackerMonth), sort_order: trackerHabits.length });
  if (error) { setMsgEl("trackerMsg", "Не удалось добавить: " + error.message, false); return; }
  await loadTrackerData();
  drawTracker();
  document.getElementById("newHabitInput")?.focus();
}

async function copyPrevMonthHabits() {
  const rows = prevMonthHabits.map((h, i) => ({ user_id: window.currentUserId, title: h.title, month: monthKey(trackerMonth), sort_order: i }));
  const { error } = await supabaseClient.from("habits").insert(rows);
  if (error) { setMsgEl("trackerMsg", "Не удалось перенести: " + error.message, false); return; }
  await loadTrackerData();
  drawTracker();
}

async function toggleHabitDay(habitId, iso) {
  const key = habitId + "|" + iso;
  const wasDone = trackerChecks.has(key);
  if (wasDone) trackerChecks.delete(key); else trackerChecks.add(key);
  const wrap = document.querySelector(".month-wrap");
  const scroll = wrap ? wrap.scrollLeft : 0;
  drawTracker();
  const w2 = document.querySelector(".month-wrap"); if (w2) w2.scrollLeft = scroll;
  const { error } = await (wasDone
    ? supabaseClient.from("habit_checks").delete().eq("habit_id", habitId).eq("day", iso)
    : supabaseClient.from("habit_checks").insert({ habit_id: habitId, user_id: window.currentUserId, day: iso }));
  if (error) {
    if (wasDone) trackerChecks.add(key); else trackerChecks.delete(key);
    drawTracker();
    setMsgEl("trackerMsg", "Не удалось сохранить отметку. Проверьте интернет и попробуйте ещё раз", false);
  }
}

async function deleteHabit(habitId, title) {
  if (!(await customConfirm(`Удалить привычку «${title}» вместе со всеми отметками за этот месяц?`))) return;
  const { error } = await supabaseClient.from("habits").delete().eq("id", habitId);
  if (error) { customAlert("Не удалось удалить: " + error.message); return; }
  await loadTrackerData();
  drawTracker();
}

/* ---------- Ежедневные записи (настроение, сон, вода, благодарность) ---------- */
let dailyLog = {}; // "YYYY-MM-DD" -> запись
async function loadDaily() {
  const days = monthDays(trackerMonth);
  const { data, error } = await supabaseClient.from("daily_log")
    .select("day, mood, mood_note, sleep_hours, water_glasses, gratitude")
    .eq("user_id", window.currentUserId).gte("day", isoDay(days[0])).lte("day", isoDay(days[days.length - 1]));
  if (error) throw error;
  dailyLog = {};
  (data || []).forEach(r => { dailyLog[r.day] = r; });
}
async function saveDaily(day, fields) {
  const { error } = await supabaseClient.from("daily_log").upsert(Object.assign({ user_id: window.currentUserId, day, updated_at: new Date().toISOString() }, fields), { onConflict: "user_id,day" });
  if (error) throw error;
  dailyLog[day] = Object.assign({}, dailyLog[day] || { day }, fields);
}

/* ---------- Настроение ---------- */
const MOODS = [
  { v: 5, e: "😄", label: "Отлично",           color: "#8fe3b0" },
  { v: 4, e: "🙂", label: "Хорошо",            color: "#B5E48C" },
  { v: 3, e: "😐", label: "Ровно",             color: "#F2D16B" },
  { v: 2, e: "😔", label: "Грустно",           color: "#9CC3F0" },
  { v: 1, e: "😣", label: "Тревожно, тяжело",  color: "#E8826A" }
];
const MOOD_BY_V = Object.fromEntries(MOODS.map(m => [m.v, m]));

async function renderMoodTab() { await loadDaily(); drawMoodTab(); }

function drawMoodTab() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const days = monthDays(trackerMonth), todayIso = isoDay(new Date());
  const lead = (days[0].getDay() + 6) % 7;
  const cells = Array(lead).fill(`<div class="cal-cell empty"></div>`).concat(days.map(d => {
    const iso = isoDay(d), r = dailyLog[iso], m = r && r.mood ? MOOD_BY_V[r.mood] : null;
    return `<button class="cal-cell${iso === todayIso ? " today" : ""}" ${iso > todayIso ? "disabled" : ""}
      style="${m ? `background:${m.color}33;border-color:${m.color};` : ""}" onclick='openMoodPicker(${JSON.stringify(iso)})'>
      <span class="cal-num">${d.getDate()}</span><span class="cal-emoji">${m ? m.e : ""}</span>${r && r.mood_note ? `<span class="cal-note-dot"></span>` : ""}
    </button>`;
  })).join("");
  const counts = MOODS.map(m => ({ label: m.e + " " + m.label, value: days.filter(d => dailyLog[isoDay(d)]?.mood === m.v).length, color: m.color }));
  const filled = counts.reduce((a, c) => a + c.value, 0);
  const avg = filled ? days.reduce((a, d) => a + (dailyLog[isoDay(d)]?.mood || 0), 0) / filled : 0;
  const top = filled ? counts.slice().sort((a, b) => b.value - a.value)[0] : null;
  const notes = days.filter(d => dailyLog[isoDay(d)]?.mood_note);

  box.innerHTML = `
    ${printTitleHtml("Трекер настроения")}
    ${monthToolbarHtml("Трекер настроения")}
    <p class="section-note no-print">Нажмите на день и выберите, какое было настроение. Можно добавить короткую заметку — что на него повлияло</p>
    <div class="cal-grid">${WEEKDAYS.map(w => `<div class="cal-head">${w}</div>`).join("")}${cells}</div>
    <div class="mood-legend">${MOODS.map(m => `<span><span class="bmi-dot" style="background:${m.color};"></span>${m.e} ${m.label}</span>`).join("")}</div>
    <div class="table-title" style="margin-top:22px;">Настроение за месяц</div>
    ${filled ? `
      <div class="stat-row">
        <div class="stat-box"><span>Отмечено дней</span><strong>${filled}</strong></div>
        <div class="stat-box"><span>Чаще всего</span><strong style="font-size:21px;">${top.label}</strong></div>
        <div class="stat-box"><span>Средняя оценка</span><strong>${fmtNum(Math.round(avg * 10) / 10)} из 5</strong></div>
      </div>
      ${hBarChartSvg(counts, { fmt: v => v + " " + daysWord(v) })}` : `<div class="empty-table">Пока нет отметок за этот месяц</div>`}
    ${notes.length ? `<div class="table-title" style="margin-top:20px;">Заметки</div>
      ${notes.map(d => { const r = dailyLog[isoDay(d)]; const m = MOOD_BY_V[r.mood]; return `<div class="grat-day"><b>${fmtDate(isoDay(d))} ${m ? m.e : ""}</b><div style="margin-top:4px;">${escapeHtml(r.mood_note)}</div></div>`; }).join("")}` : ""}`;
}

function openMoodPicker(iso) {
  const r = dailyLog[iso] || {};
  showModal(`
    <h3 style="margin:0;color:var(--cream);font-family:PT Serif,Georgia,serif;font-weight:500;">Настроение · ${fmtDate(iso)}</h3>
    <div class="mood-pick">${MOODS.map(m => `<button type="button" class="mood-btn ${r.mood === m.v ? "sel" : ""}" data-v="${m.v}" style="--mc:${m.color};" onclick="selectMood(this)"><span>${m.e}</span>${m.label}</button>`).join("")}</div>
    <textarea id="moodNote" class="input" rows="3" maxlength="300" placeholder="Что повлияло на настроение (необязательно)">${escapeHtml(r.mood_note || "")}</textarea>
    <div id="moodMsg" class="msg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;">
      ${r.mood ? `<button class="btn btn-ghost" onclick='saveMood(${JSON.stringify(iso)}, true)'>Очистить</button>` : ""}
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick='saveMood(${JSON.stringify(iso)})'>Сохранить</button>
    </div>`);
}
function selectMood(btn) {
  btn.parentElement.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
  setMsgEl("moodMsg", "", true);
}
async function saveMood(iso, clear) {
  const sel = document.querySelector(".mood-btn.sel");
  const note = (document.getElementById("moodNote")?.value || "").trim() || null;
  if (!clear && !sel) { setMsgEl("moodMsg", "Выберите настроение", false); return; }
  try {
    await saveDaily(iso, clear ? { mood: null, mood_note: null } : { mood: Number(sel.dataset.v), mood_note: note });
    closeModal();
    drawMoodTab();
  } catch (e) { setMsgEl("moodMsg", "Не удалось сохранить: " + e.message, false); }
}

/* ---------- Сон и вода ---------- */
const GLASS_ML = 250;
async function renderSleepTab() { await loadDaily(); drawSleepTab(); }

function sleepChartsHtml() {
  const days = monthDays(trackerMonth);
  const sleep = days.map(d => Number(dailyLog[isoDay(d)]?.sleep_hours) || 0);
  const water = days.map(d => Number(dailyLog[isoDay(d)]?.water_glasses) || 0);
  const sDays = sleep.filter(v => v > 0), wDays = water.filter(v => v > 0);
  const avgS = sDays.length ? sDays.reduce((a, b) => a + b, 0) / sDays.length : 0;
  const avgW = wDays.length ? wDays.reduce((a, b) => a + b, 0) / wDays.length : 0;
  return `
    <div class="stat-row">
      <div class="stat-box"><span>Средний сон</span><strong>${sDays.length ? fmtNum(Math.round(avgS * 10) / 10) + " ч" : "—"}</strong><em>норма 7–9 ч</em></div>
      <div class="stat-box"><span>Ночей со сном 7–9 ч</span><strong>${sleep.filter(v => v >= 7 && v <= 9).length}</strong><em>из ${sDays.length} отмеченных</em></div>
      <div class="stat-box"><span>В среднем воды</span><strong>${wDays.length ? fmtNum(Math.round(avgW * 10) / 10) : "—"}</strong><em>стаканов в день (1 стакан = ${GLASS_ML} мл)</em></div>
      <div class="stat-box"><span>Дней с нормой воды</span><strong>${water.filter(v => v >= 8).length}</strong><em>8 стаканов и больше</em></div>
    </div>
    <div class="table-title">Сон, часов</div>
    ${dayBarsSvg(days, sleep, { max: 10, norms: [7, 9], color: "#9CC3F0", unit: "ч" })}
    <div class="table-title" style="margin-top:16px;">Вода, стаканов</div>
    ${dayBarsSvg(days, water, { max: 10, norms: [8], color: "#7FC8E8", unit: "стак." })}`;
}

function drawSleepTab() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const days = monthDays(trackerMonth), todayIso = isoDay(new Date());
  const rows = days.filter(d => isoDay(d) <= todayIso).reverse().map(d => {
    const iso = isoDay(d), r = dailyLog[iso] || {}, future = false;
    const w = Number(r.water_glasses) || 0;
    return `<tr${iso === todayIso ? ` style="background:rgba(244,165,130,.10);"` : ""}>
      <td style="white-space:nowrap;">${d.getDate()} <span style="color:var(--muted);font-size:12px;">${WEEKDAYS[(d.getDay() + 6) % 7]}</span></td>
      <td><input class="input mini-input" type="text" inputmode="decimal" placeholder="—" value="${r.sleep_hours != null ? fmtNum(r.sleep_hours) : ""}" ${future ? "disabled" : ""} onchange='saveSleep(${JSON.stringify(iso)}, this)'></td>
      <td><div class="water-ctrl">
        <button ${future ? "disabled" : ""} onclick='changeWater(${JSON.stringify(iso)}, -1)' aria-label="Меньше">−</button>
        <b id="water-${iso}">${w}</b>
        <button ${future ? "disabled" : ""} onclick='changeWater(${JSON.stringify(iso)}, 1)' aria-label="Больше">+</button>
        <span class="water-drops" id="drops-${iso}">${"💧".repeat(Math.min(w, 12))}</span>
      </div></td>
    </tr>`;
  }).join("");
  box.innerHTML = `
    ${printTitleHtml("Сон и вода")}
    ${monthToolbarHtml("Сон и вода")}
    <div id="sleepCharts">${sleepChartsHtml()}</div>
    <div class="no-print">
      <div class="table-title" style="margin-top:20px;">Записи по дням</div>
      <p class="section-note">Сон — сколько часов спали в ночь на этот день. Вода — нажимайте «+» за каждый выпитый стакан</p>
      <div id="sleepMsg" class="msg"></div>
      <div style="overflow-x:auto;"><table class="data-table">
        <thead><tr><th>День</th><th>Сон, ч</th><th>Вода, стаканов</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="3" class="empty-table">Этот месяц ещё не начался</td></tr>`}</tbody>
      </table></div>
    </div>`;
}

function refreshSleepCharts() { const el = document.getElementById("sleepCharts"); if (el) el.innerHTML = sleepChartsHtml(); }

async function saveSleep(iso, input) {
  const raw = input.value.trim();
  const v = raw === "" ? null : parseNum(raw);
  if (v !== null && !(v >= 0 && v <= 24)) { setMsgEl("sleepMsg", "Сон укажите в часах, например 7,5", false); input.focus(); return; }
  try {
    await saveDaily(iso, { sleep_hours: v === null ? null : Math.round(v * 2) / 2 });
    setMsgEl("sleepMsg", "", true);
    refreshSleepCharts();
  } catch (e) { setMsgEl("sleepMsg", "Не удалось сохранить: " + e.message, false); }
}

async function changeWater(iso, delta) {
  const cur = Number(dailyLog[iso]?.water_glasses) || 0;
  const n = Math.max(0, Math.min(30, cur + delta));
  if (n === cur) return;
  try {
    await saveDaily(iso, { water_glasses: n });
    const b = document.getElementById("water-" + iso); if (b) b.textContent = n;
    const dr = document.getElementById("drops-" + iso); if (dr) dr.textContent = "💧".repeat(Math.min(n, 12));
    refreshSleepCharts();
  } catch (e) { setMsgEl("sleepMsg", "Не удалось сохранить: " + e.message, false); }
}

/* ---------- Дневник благодарности ---------- */
let gratDay = null;
async function renderGratitudeTab() { await loadDaily(); drawGratitudeTab(); }

function drawGratitudeTab() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const days = monthDays(trackerMonth), todayIso = isoDay(new Date());
  const first = isoDay(days[0]), lastAllowed = [isoDay(days[days.length - 1]), todayIso].sort()[0];
  if (!gratDay || gratDay < first || gratDay > lastAllowed) gratDay = lastAllowed >= first ? lastAllowed : first;
  const cur = Array.isArray(dailyLog[gratDay]?.gratitude) ? dailyLog[gratDay].gratitude : [];
  const entries = days.filter(d => (dailyLog[isoDay(d)]?.gratitude || []).length).reverse();
  const passed = days.filter(d => isoDay(d) <= todayIso).length;

  const W = 760, n = days.length, cw = W / n;
  const strip = `<svg viewBox="0 0 ${W} 46" class="chart-svg">${days.map((d, i) => {
    const has = (dailyLog[isoDay(d)]?.gratitude || []).length;
    return `<rect x="${i * cw + 1.5}" y="2" width="${cw - 3}" height="26" rx="5" style="${has ? "fill:#F4A582;" : "fill:var(--track);"}"/>
      <text x="${i * cw + cw / 2}" y="42" text-anchor="middle" style="fill:var(--muted);font-size:10px;">${d.getDate()}</text>`;
  }).join("")}</svg>`;

  box.innerHTML = `
    ${printTitleHtml("Дневник благодарности")}
    ${monthToolbarHtml("Дневник благодарности")}
    <div class="no-print" style="max-width:620px;">
      <p class="section-note">Каждый вечер запишите три вещи, за которые вы благодарны сегодня — людям, событиям, себе</p>
      <label class="form-row"><span>Дата</span><input id="gDay" class="input" type="date" style="max-width:220px;" value="${gratDay}" min="${first}" max="${lastAllowed}" onchange="gratDay=this.value;drawGratitudeTab()"></label>

async function saveGratitude() {

/* ---------- Колесо баланса ---------- */
const WHEEL_SPHERES = ["Здоровье", "Отношения", "Семья", "Дело и карьера", "Финансы", "Саморазвитие", "Отдых и хобби", "Духовность"];
let wheelCur = null, wheelPrev = null, wheelDraft = null;

async function renderWheelTab() {
  const prevKey = monthKey(new Date(trackerMonth.getFullYear(), trackerMonth.getMonth() - 1, 1));
  const { data, error } = await supabaseClient.from("balance_wheel").select("month, scores")
    .eq("user_id", window.currentUserId).in("month", [monthKey(trackerMonth), prevKey]);
  if (error) throw error;
  wheelCur = (data || []).find(r => r.month === monthKey(trackerMonth))?.scores || null;
  wheelPrev = (data || []).find(r => r.month === prevKey)?.scores || null;
  wheelDraft = (wheelCur || WHEEL_SPHERES.map(() => 5)).slice();
  drawWheelTab();
}

function radarSvg(vals, prev) {
  const W = 480, H = 430, cx = W / 2, cy = 210, R = 150, n = WHEEL_SPHERES.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 10, cy + Math.sin(a) * R * v / 10]; };
  const poly = (arr) => arr.map((v, i) => pt(i, v).map(c => c.toFixed(1)).join(",")).join(" ");
  const rings = [2, 4, 6, 8, 10].map(r => `<polygon points="${poly(Array(n).fill(r))}" fill="none" style="stroke:var(--line-soft);" stroke-width="0.8"/>`).join("");
  const axes = WHEEL_SPHERES.map((s, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line-soft);" stroke-width="0.8"/>`; }).join("");
  const labels = WHEEL_SPHERES.map((s, i) => {
    const [x, y] = pt(i, 11.6), anchor = Math.abs(x - cx) < 10 ? "middle" : (x > cx ? "start" : "end");
    return `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" style="fill:var(--text);font-size:13px;">${s} <tspan style="fill:var(--coral);font-weight:700;">${vals[i]}</tspan></text>`;
  }).join("");
  return `<svg viewBox="-70 0 ${W + 140} ${H}" class="chart-svg" style="max-width:${W + 140}px;margin:0 auto;" id="wheelSvg">
    ${rings}${axes}
    ${prev ? `<polygon points="${poly(prev)}" fill="rgba(127,167,232,.15)" stroke="#7FA7E8" stroke-width="2" stroke-dasharray="6 4"/>` : ""}
    <polygon points="${poly(vals)}" fill="rgba(244,165,130,.28)" stroke="#F4A582" stroke-width="2.5"/>
    ${vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x}" cy="${y}" r="4" fill="#E8826A"/>`; }).join("")}
    ${labels}
    <g transform="translate(${W / 2 - 150}, ${H - 18})">
      <rect width="14" height="4" y="-4" fill="#F4A582"/><text x="20" y="0" style="fill:var(--muted);font-size:12px;">${monthTitleText()}</text>
      ${prev ? `<rect x="170" width="14" height="4" y="-4" fill="#7FA7E8"/><text x="190" y="0" style="fill:var(--muted);font-size:12px;">прошлый месяц</text>` : ""}
    </g>
  </svg>`;
}

function drawWheelTab() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const vals = wheelDraft;
  const low = WHEEL_SPHERES.map((s, i) => ({ s, v: vals[i] })).sort((a, b) => a.v - b.v).slice(0, 2);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  box.innerHTML = `
    ${printTitleHtml("Колесо баланса")}
    ${monthToolbarHtml("Колесо баланса")}
    <p class="section-note no-print">Оцените каждую сферу жизни от 1 до 10 — насколько вы довольны ею сейчас. Делайте это раз в месяц и сравнивайте</p>
    <div class="wheel-wrap">
      <div class="no-print">
        ${WHEEL_SPHERES.map((s, i) => `<div class="wheel-row"><span>${s}</span>
          <input type="range" min="1" max="10" step="1" value="${vals[i]}" oninput="wheelDraft[${i}]=Number(this.value);this.nextElementSibling.textContent=this.value;updateWheelChart()"><b>${vals[i]}</b></div>`).join("")}
        <button class="btn" onclick="saveWheel()">Сохранить оценку за ${MONTHS[trackerMonth.getMonth()].toLowerCase()}</button>
        <div id="wheelMsg" class="msg">${wheelCur ? "" : `<span style="color:var(--muted);">За этот месяц оценки ещё нет</span>`}</div>
      </div>
      <div id="wheelChart">${radarSvg(vals, wheelPrev)}</div>
    </div>
    <div id="wheelInfo">${wheelInfoHtml(vals, avg, low)}</div>`;
}
function wheelInfoHtml(vals, avg, low) {
  return `<div class="stat-row" style="margin-top:14px;">
      <div class="stat-box"><span>Средний балл</span><strong>${fmtNum(Math.round(avg * 10) / 10)} из 10</strong></div>
      <div class="stat-box"><span>Точки роста на следующий месяц</span><strong style="font-size:19px;">${low.map(l => l.s + " (" + l.v + ")").join(", ")}</strong></div>
    </div>
    ${wheelPrev ? `<table class="data-table"><thead><tr><th>Сфера</th><th>Сейчас</th><th>Прошлый месяц</th><th>Изменение</th></tr></thead><tbody>
      ${WHEEL_SPHERES.map((s, i) => { const d = vals[i] - wheelPrev[i]; return `<tr><td>${s}</td><td>${vals[i]}</td><td>${wheelPrev[i]}</td><td style="color:${d > 0 ? "var(--ok)" : (d < 0 ? "var(--bad)" : "var(--muted)")};">${d > 0 ? "+" + d : d}</td></tr>`; }).join("")}
    </tbody></table>` : ""}`;
}
function updateWheelChart() {
  const vals = wheelDraft;
  const el = document.getElementById("wheelChart"); if (el) el.innerHTML = radarSvg(vals, wheelPrev);
  const low = WHEEL_SPHERES.map((s, i) => ({ s, v: vals[i] })).sort((a, b) => a.v - b.v).slice(0, 2);
  const info = document.getElementById("wheelInfo"); if (info) info.innerHTML = wheelInfoHtml(vals, vals.reduce((a, b) => a + b, 0) / vals.length, low);
}
async function saveWheel() {
  const { error } = await supabaseClient.from("balance_wheel").upsert({ user_id: window.currentUserId, month: monthKey(trackerMonth), scores: wheelDraft, updated_at: new Date().toISOString() }, { onConflict: "user_id,month" });
  if (error) { setMsgEl("wheelMsg", "Не удалось сохранить: " + error.message, false); return; }
  wheelCur = wheelDraft.slice();
  setMsgEl("wheelMsg", "Сохранено", true);
}

async function renderChallengeTab() {

function addDays(iso, n) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d + n); }

function drawChallengeTab() {
  const box = document.getElementById("trackerBox");

      <div class="ch-grid">${Array.from({ length: 21 }, (_, i) => {

  box.innerHTML = `

    ${challenges.length ? `<div class="table-title">Прогресс</div>

async function startChallenge(title) {
  title = (title || document.getElementById("chCustom")?.value || "").trim();
  if (!title) { setMsgEl("chMsg", "Выберите челлендж или впишите свой", false); return; }
  const { error } = await supabaseClient.from("challenges").insert({ user_id: window.currentUserId, title, start_day: isoDay(new Date()), done: [] });
  if (error) { setMsgEl("chMsg", "Не удалось начать: " + error.message, false); return; }
  await renderChallengeTab();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function toggleChallengeDay(id, day) {
  const c = challenges.find(x => x.id === id); if (!c) return;
  const done = c.done.includes(day) ? c.done.filter(d => d !== day) : c.done.concat(day).sort((a, b) => a - b);
  const old = c.done; c.done = done; drawChallengeTab();
  const { error } = await supabaseClient.from("challenges").update({ done }).eq("id", id);
  if (error) { c.done = old; drawChallengeTab(); customAlert("Не удалось сохранить отметку: " + error.message); }
}
async function deleteChallenge(id, title) {
  if (!(await customConfirm(`Удалить челлендж «${title}»?`))) return;
  const { error } = await supabaseClient.from("challenges").delete().eq("id", id);
  if (error) { customAlert("Не удалось удалить: " + error.message); return; }
  await renderChallengeTab();
}

async function renderBodyTab() {

function drawBodyTab() {
  const box = document.getElementById("trackerBox");
  if (!box) return;
  const p = bodyProfile || {};
  const thisYear = new Date().getFullYear();
  const last = weightLog[weightLog.length - 1];
  const first = weightLog[0];

  let results = `<div class="empty-table">Заполните рост и добавьте свой вес — здесь появится ИМТ и норма калорий</div>`;
  if (p.height_cm && last) {
    const h = Number(p.height_cm) / 100;
    const bmi = last.w / (h * h);
    const cat = bmiCategory(bmi);
    const c = BMI_TABLE[cat];
    const normMin = 18.5 * h * h, normMax = 24.9 * h * h;
    const change = weightLog.length > 1 ? last.w - first.w : null;

    let calories = "";
    if (p.sex && p.birth_year && p.activity) {
      const age = thisYear - Number(p.birth_year);
      const bmr = 10 * last.w + 6.25 * Number(p.height_cm) - 5 * age + (p.sex === "m" ? 5 : -161);
      const keep = bmr * Number(p.activity);
      const floor = p.sex === "m" ? 1500 : 1200;
      const lose = Math.max(keep * 0.85, floor);
      const gain = keep * 1.15;
      const rec = bmi < 18.5 ? "gain" : (bmi >= 25 ? "lose" : "keep");
      const r10 = (v) => Math.round(v / 10) * 10;
      calories = `
        <div class="table-title" style="margin-top:6px;">Калорийность в день</div>
        <div class="stat-row">
          <div class="stat-box ${rec === "lose" ? "recommended" : ""}"><span>Плавное снижение веса</span><strong>${fmtNum(r10(lose), 0)}</strong><em>ккал${rec === "lose" ? " · рекомендуем" : ""}</em></div>
          <div class="stat-box ${rec === "keep" ? "recommended" : ""}"><span>Поддержание веса</span><strong>${fmtNum(r10(keep), 0)}</strong><em>ккал${rec === "keep" ? " · рекомендуем" : ""}</em></div>
          <div class="stat-box ${rec === "gain" ? "recommended" : ""}"><span>Плавный набор веса</span><strong>${fmtNum(r10(gain), 0)}</strong><em>ккал${rec === "gain" ? " · рекомендуем" : ""}</em></div>
        </div>

function weightChartSvg() {
  if (weightLog.length < 2) return "";
  const W = 760, H = 220, pl = 46, pr = 14, pt = 16, pb = 30;
  const ws = weightLog.map(r => r.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const t0 = new Date(weightLog[0].day).getTime(), t1 = new Date(weightLog[weightLog.length - 1].day).getTime();
  const x = (d) => pl + (t1 === t0 ? 0 : (new Date(d).getTime() - t0) / (t1 - t0)) * (W - pl - pr);
  const y = (v) => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const pts = weightLog.map(r => `${x(r.day).toFixed(1)},${y(r.w).toFixed(1)}`).join(" ");
  const ticks = [lo, (lo + hi) / 2, hi];
  return `
    <div class="table-title" style="margin-top:18px;">Динамика веса</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(244,165,130,.15)"/>
        <text x="${pl - 8}" y="${y(t) + 4}" fill="#8C97B8" font-size="12" text-anchor="end">${fmtNum(Math.round(t * 10) / 10)}</text>`).join("")}
      <polyline points="${pts}" fill="none" stroke="#F4A582" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${weightLog.map(r => `<circle cx="${x(r.day)}" cy="${y(r.w)}" r="4" fill="#E8826A"><title>${fmtDate(r.day)}: ${fmtNum(r.w)} кг</title></circle>`).join("")}
      <text x="${pl}" y="${H - 8}" fill="#8C97B8" font-size="12">${fmtDate(weightLog[0].day)}</text>
      <text x="${W - pr}" y="${H - 8}" fill="#8C97B8" font-size="12" text-anchor="end">${fmtDate(weightLog[weightLog.length - 1].day)}</text>
    </svg>`;
}

async function saveBodyProfile() {
  const sex = document.getElementById("bpSex").value || null;
  const yearRaw = document.getElementById("bpYear").value;
  const heightRaw = document.getElementById("bpHeight").value;
  const activity = document.getElementById("bpActivity").value ? Number(document.getElementById("bpActivity").value) : null;
  const year = yearRaw ? parseInt(yearRaw, 10) : null;
  const height = heightRaw ? parseNum(heightRaw) : null;
  const thisYear = new Date().getFullYear();
  if (year !== null && (!(year >= 1920) || year > thisYear - 10)) { setMsgEl("bodyProfileMsg", "Проверьте год рождения", false); return; }
  if (height !== null && !(height >= 100 && height <= 250)) { setMsgEl("bodyProfileMsg", "Рост укажите в сантиметрах, например 165", false); return; }
  const row = { user_id: window.currentUserId, sex, birth_year: year, height_cm: height, activity, updated_at: new Date().toISOString() };
  const { error } = await supabaseClient.from("body_profile").upsert(row, { onConflict: "user_id" });
  if (error) { setMsgEl("bodyProfileMsg", "Не удалось сохранить: " + error.message, false); return; }
  bodyProfile = row;
  drawBodyTab();
  setMsgEl("bodyProfileMsg", "Сохранено", true);
}

async function saveWeight() {
  const day = document.getElementById("wDay").value;
  const w = parseNum(document.getElementById("wValue").value);
  if (!day) { setMsgEl("weightMsg", "Выберите дату", false); return; }
  if (!(w >= 20 && w <= 400)) { setMsgEl("weightMsg", "Введите вес в килограммах, например 65,5", false); return; }
  const { error } = await supabaseClient.from("weight_log").upsert({ user_id: window.currentUserId, day, weight_kg: Math.round(w * 10) / 10 }, { onConflict: "user_id,day" });
  if (error) { setMsgEl("weightMsg", "Не удалось сохранить: " + error.message, false); return; }
  await renderBodyTab();
  setMsgEl("weightMsg", "Записано", true);
}

async function deleteWeight(day) {
  if (!(await customConfirm(`Удалить запись веса за ${fmtDate(day)}?`))) return;
  const { error } = await supabaseClient.from("weight_log").delete().eq("user_id", window.currentUserId).eq("day", day);
  if (error) { customAlert("Не удалось удалить: " + error.message); return; }
  await renderBodyTab();
}

function computeEndsAt(termValue) {
  if (termValue === "unlimited") return { unlimited: true, ends_at: null };

async function saveTeacherSchoolName() {
  const name = (document.getElementById("teacherSchoolNameInput")?.value || "").trim();
  if (!name) { setMsgEl("teacherSchoolMsg", "Введите название", false); return; }
  setMsgEl("teacherSchoolMsg", "Сохраняю...", true);
  try {
    const { data: existing } = await supabaseClient.from("schools").select("id").eq("owner_id", window.currentUserId).maybeSingle();
    let schoolId = existing?.id;
    if (existing) {
      const { error } = await supabaseClient.from("schools").update({ name }).eq("id", existing.id);
      if (error) throw error;
    } else {
      const { data: created, error } = await supabaseClient.from("schools").insert({ owner_id: window.currentUserId, name }).select("id").single();
      if (error) throw error;
      schoolId = created.id;
    }
    await supabaseClient.from("profiles").update({ school_id: schoolId }).eq("id", window.currentUserId);
    setMsgEl("teacherSchoolMsg", "Сохранено", true);
  } catch (e) {
    setMsgEl("teacherSchoolMsg", "Не удалось сохранить: " + (e.message || e), false);

}

let adminUsersFilterTeacher = null;
const nameOf = (u) => [u.last_name, u.first_name, u.middle_name].filter(Boolean).join(" ") || u.email || "Пользователь";

async function loadAdminUsers() {
  const box = document.getElementById("adminUsersTable");
  if (!box) return;
  const admin = isAdmin();

  let query = supabaseClient.from("profiles")
    .select("id, first_name, last_name, middle_name, email, phone, role, status, teacher_id, created_at, restored_at")
    .neq("status", "deleted")
    .order("last_name", { ascending: true });
  if (!admin) query = query.eq("teacher_id", window.currentUserId);
  const { data, error } = await query;
  if (error) { box.innerHTML = `<div class="empty-table">Не удалось загрузить пользователей</div>`; return; }

  const allUsers = data || [];
  const users = (admin && adminUsersFilterTeacher) ? allUsers.filter(u => u.teacher_id === adminUsersFilterTeacher.id) : allUsers;

  const fillSelect = (id, list, emptyLabel) => {
    const el = document.getElementById(id);
    if (!el) return;
    const prev = el.value;
    el.innerHTML = list.length
      ? list.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(nameOf(u))}${u.email ? " — " + escapeHtml(u.email) : ""}</option>`).join("")
      : `<option value="">${emptyLabel}</option>`;
    if (prev && list.some(u => u.id === prev)) el.value = prev;
  };
  const nonAdmins = allUsers.filter(u => u.role !== "admin");
  fillSelect("accessUserSelect", nonAdmins, "Нет пользователей");
  fillSelect("roleUserSelect", nonAdmins, "Нет пользователей");
  fillSelect("attachStudentSelect", allUsers.filter(u => u.role === "student"), "Нет учеников");
  fillSelect("attachTeacherSelect", allUsers.filter(u => u.role === "teacher"), "Нет учителей");
  loadScopeForSelectedUser();

  const accessByUser = {};
  if (users.length) {
    const { data: periods } = await supabaseClient.from("access_periods")
      .select("profile_id, status, ends_at, is_unlimited, payment_status, starts_at, created_at")
      .in("profile_id", users.map(u => u.id)).order("created_at", { ascending: false });
    (periods || []).forEach(p => { if (!accessByUser[p.profile_id]) accessByUser[p.profile_id] = p; });
  }
  const accessBadge = (u) => {
    if (u.role === "admin") return "";
    const p = accessByUser[u.id];
    if (!p) return `<div style="font-size:11px;color:var(--muted);margin-top:3px;">Доступ не выдавался</div>`;
    if (hasActivePlatformAccess(p)) return `<div style="font-size:11px;color:var(--ok);margin-top:3px;">Доступ активен${p.is_unlimited ? "" : " до " + fmtDate(p.ends_at)}</div>`;
    return `<div style="font-size:11px;color:#e8a94e;margin-top:3px;">Доступ истёк <button class="btn btn-small" style="margin-left:4px;padding:2px 8px;" onclick='scrollToGrantAccess(${JSON.stringify(u.id)})'>Возобновить</button></div>`;
  };
  const teacherName = (id) => { if (!id) return "—"; const t = allUsers.find(u => u.id === id); return t ? nameOf(t) : "—"; };

  const backLink = (admin && adminUsersFilterTeacher)
    ? `<button class="btn btn-ghost btn-small" style="margin-bottom:12px;" onclick="adminUsersFilterTeacher=null;loadAdminUsers()">← Все пользователи</button>
       <div style="margin-bottom:10px;color:var(--cream);">Ученики учителя: ${escapeHtml(adminUsersFilterTeacher.name)}</div>` : "";

  if (!users.length) {
    box.innerHTML = backLink + `<div class="empty-table">${adminUsersFilterTeacher ? "У этого учителя пока нет учеников" : (admin ? "Зарегистрированных пользователей пока нет" : "У вас пока нет учеников. Дайте им свой код для регистрации")}</div>`;
  } else {
    box.innerHTML = backLink + `
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Пользователь</th><th>Email</th><th>Телефон</th><th>Роль</th><th>Зарегистрирован</th>${admin ? "<th>Код учителя</th><th>Учитель</th>" : ""}<th>Статус</th><th></th></tr></thead>
        <tbody>${users.map(u => `
          <tr>
            <td>${admin ? `<a href="javascript:void(0)" style="color:var(--cream);" onclick='showUserDetailModal(${JSON.stringify(u.id)})'>${escapeHtml(nameOf(u))}</a>` : escapeHtml(nameOf(u))}</td>
            <td>${escapeHtml(u.email || "—")}</td>
            <td>${escapeHtml(u.phone || "—")}</td>
            <td>${escapeHtml(roleLabel(u.role))}</td>
            <td>${fmtDateTime(u.created_at)}${u.restored_at ? " / " + fmtDateTime(u.restored_at) : ""}</td>
            ${admin ? `<td style="font-family:'Courier New',monospace;color:var(--coral);font-weight:bold;">${u.role === "teacher" ? escapeHtml(u.id.slice(0, 8).toUpperCase()) : "—"}</td>
                       <td>${u.role === "student" ? escapeHtml(teacherName(u.teacher_id)) : "—"}</td>` : ""}
            <td>${u.restored_at ? `Восстановлен ${fmtDate(u.restored_at)}` : "Активен"}${accessBadge(u)}</td>
            <td>${u.role === "admin" ? "—" : `<button class="btn btn-ghost btn-small" onclick='deleteUserAccount(${JSON.stringify(u.id)}, ${JSON.stringify(nameOf(u))})'>Удалить</button>`}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>`;
  }
  loadDeletedUsersLog();
}

function toggleScopeAll(checked) {
  document.querySelectorAll(".scope-cell, .scope-visible").forEach(el => { el.checked = checked; });
}

async function loadScopeForSelectedUser() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  document.querySelectorAll(".scope-cell, .scope-visible").forEach(el => { el.checked = false; });
  const all = document.getElementById("scopeSelectAll");
  if (all) all.checked = false;
  window.loadedScope = {};
  if (!userId) return;
  const { data } = await supabaseClient.from("access_periods")
    .select("status, payment_status, ends_at, is_unlimited, granted_scope, created_at")
    .eq("profile_id", userId).order("created_at", { ascending: false }).limit(10);
  const scope = ((data || []).filter(hasActivePlatformAccess)[0] || {}).granted_scope || {};
  window.loadedScope = scope;
  document.querySelectorAll(".scope-cell").forEach(el => {
    const item = scope[el.dataset.key];
    el.checked = !!(item && item.granted);
    const term = document.querySelector(`[data-term="${el.dataset.key}"]`);
    if (term && item && item.granted) {
      if (item.unlimited || !item.ends_at) term.value = "unlimited";
      else {
        const daysLeft = Math.round((new Date(item.ends_at) - new Date()) / 86400000);
        const closest = TERM_OPTIONS.filter(t => t.value !== "unlimited").reduce((a, b) => Math.abs(b.value - daysLeft) < Math.abs(a.value - daysLeft) ? b : a);
        term.value = closest.value;
      }
    }
  });
  document.querySelectorAll(".scope-visible").forEach(el => {
    const item = scope[el.dataset.key];
    el.checked = !!(item && item.visible === true);
  });
  if (all) all.checked = Array.from(document.querySelectorAll(".scope-cell, .scope-visible")).every(el => el.checked);
}

function collectScope() {
  // Разделы, которых нет в форме (например, у учителя они не открыты), сохраняются как были
  const scope = JSON.parse(JSON.stringify(window.loadedScope || {}));
  document.querySelectorAll(".scope-cell").forEach(el => {
    const key = el.dataset.key;
    const term = document.querySelector(`[data-term="${key}"]`)?.value || "unlimited";
    scope[key] = el.checked ? Object.assign({ granted: true }, computeEndsAt(term)) : { granted: false };
    if (!el.checked && window.loadedScope?.[key]?.visible) scope[key].visible = true;
  });
  document.querySelectorAll(".scope-visible").forEach(el => {
    scope[el.dataset.key] = scope[el.dataset.key] || { granted: false };
    scope[el.dataset.key].visible = el.checked;
  });
  return scope;
}

async function grantPlatformAccess() {
  const userId = document.getElementById("accessUserSelect")?.value || "";
  if (!userId) { setMsgEl("accessAdminMsg", "Сначала выберите пользователя", false); return; }
  const scope = collectScope();
  const anything = Object.values(scope).some(i => i.granted || i.visible);
  if (!anything) { setMsgEl("accessAdminMsg", "Отметьте хотя бы один пункт", false); return; }
  setMsgEl("accessAdminMsg", "Выдаю доступ...", true);

  await supabaseClient.from("access_periods").update({ status: "expired" }).eq("profile_id", userId).eq("status", "active");

  // Общий срок записи = самый поздний из выбранных сроков (или бессрочно, если все бессрочные)
  let overallUnlimited = true, overallEndsAt = null;
  Object.values(scope).forEach(item => {
    if (!item.granted || item.unlimited) return;
    overallUnlimited = false;
    if (item.ends_at && (!overallEndsAt || new Date(item.ends_at) > new Date(overallEndsAt))) overallEndsAt = item.ends_at;
  });

  const { error } = await supabaseClient.from("access_periods").insert({
    profile_id: userId, status: "active", payment_status: "paid",
    starts_at: new Date().toISOString(),
    ends_at: overallUnlimited ? null : overallEndsAt,
    is_unlimited: overallUnlimited,
    granted_scope: scope
  });
  if (error) { setMsgEl("accessAdminMsg", "Не удалось выдать доступ: " + error.message, false); return; }
  setMsgEl("accessAdminMsg", "Доступ выдан", true);
  await loadAdminUsers();
}

  const digits = el.value.replace(/\D/g, "").slice(0, 15);
  el.value = digits ? "+" + digits : "";
}

async function loginUser() {
  const email = document.getElementById("loginEmail")?.value.trim().toLowerCase();
  const password = document.getElementById("loginPassword")?.value || "";
  const err = document.getElementById("loginError");
  if (err) err.textContent = "";
  if (!email || !password) { if (err) err.textContent = "Введите email и пароль."; return; }
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error || !data?.user) {
    const banned = /banned/i.test(error?.message || "");
    if (err) err.textContent = banned ? "Аккаунт отключён. Обратитесь к администратору." : (/confirm/i.test(error?.message || "") ? "Подтвердите email — письмо со ссылкой пришло на вашу почту." : "Неверный email или пароль.");
    return;
  }
  updateLastActivity();
  location.reload();
}

async function registerUser() {
  const val = (id) => document.getElementById(id)?.value.trim() || "";
  const lastName = val("registerLastName"), firstName = val("registerFirstName"), middleName = val("registerMiddleName");
  const phone = val("registerPhone"), email = val("registerEmail").toLowerCase();
  const teacherCode = val("registerTeacherCode").toUpperCase();
  const password = document.getElementById("registerPassword")?.value || "";
  const password2 = document.getElementById("registerPassword2")?.value || "";
  const box = document.getElementById("registerMessage");
  const say = (text, ok = false) => { if (box) { box.textContent = text; box.className = "auth-message " + (ok ? "success" : "error"); } };

  const nameRe = /^[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі' -]{2,}$/;
  if (!lastName || !firstName || !phone || !email || !password || !password2) { say("Заполните все обязательные поля: фамилия, имя, телефон, email и пароль."); return; }
  if (!nameRe.test(lastName)) { say("Проверьте фамилию — только буквы, не менее 2 символов."); return; }
  if (!nameRe.test(firstName)) { say("Проверьте имя — только буквы, не менее 2 символов."); return; }
  if (middleName && !nameRe.test(middleName)) { say("Проверьте отчество — только буквы."); return; }
  if (!/^\+\d{8,15}$/.test(phone)) { say("Проверьте телефон — начните с + и кода страны, например +77001234567."); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { say("Проверьте email."); return; }
  if (password.length < 6) { say("Пароль должен содержать минимум 6 символов."); return; }
  if (password !== password2) { say("Пароли не совпадают."); return; }

  say("Создаю аккаунт...", true);
  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: {
      data: { first_name: firstName, last_name: lastName, middle_name: middleName || null, phone, teacher_code: teacherCode },
      emailRedirectTo: window.location.origin + window.location.pathname
    }
  });
  if (error) {
    say(/registered/i.test(error.message) ? "Этот email уже зарегистрирован. Войдите или восстановите пароль." : (error.message || "Не удалось зарегистрироваться."));
    return;
  }
  if (data?.session) {
    say("Регистрация завершена. Сейчас откроется платформа.", true);
    setTimeout(() => location.reload(), 900);
  } else {
    say("Аккаунт создан. Подтвердите email по ссылке из письма и войдите.", true);
  }
}

let resetSent = false;
function showForgotPassword() {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        ${authHeader()}
        <h2>Восстановление пароля</h2>
        <input id="resetEmail" type="email" placeholder="Введите ваш email">
        <button class="btn" type="button" onclick="sendPasswordReset()">Отправить ссылку</button>
        <div id="resetMessage" class="auth-message"></div>
        <button class="auth-link" type="button" onclick="showLogin()">← Вернуться ко входу</button>
      </div>
    </div>`;
  resetSent = false;
}
async function sendPasswordReset() {
  const email = document.getElementById("resetEmail")?.value.trim().toLowerCase();
  const box = document.getElementById("resetMessage");
  const say = (t, ok) => { if (box) { box.textContent = t; box.className = "auth-message " + (ok ? "success" : "error"); } };
  if (!email) { say("Введите ваш email.", false); return; }
  if (resetSent) { say("Ссылка уже отправлена. Проверьте почту.", true); return; }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error) { say(error.message || "Не удалось отправить письмо.", false); return; }
  resetSent = true;
  say("Ссылка для восстановления пароля отправлена на вашу почту.", true);
}

function showSetNewPasswordForm() {
  document.body.style.visibility = "visible";
  document.body.innerHTML = `
    <div class="auth-shell">
      <div class="auth-card">
        ${authHeader()}
        <h2>Новый пароль</h2>
        <input id="newPassword1" type="password" placeholder="Новый пароль">
        <input id="newPassword2" type="password" placeholder="Повторите новый пароль">
        <button class="btn" type="button" onclick="submitNewPassword()">Сохранить пароль</button>
        <div id="newPasswordMessage" class="auth-message error"></div>
      </div>
    </div>`;
}
async function submitNewPassword() {
  const p1 = document.getElementById("newPassword1")?.value || "";
  const p2 = document.getElementById("newPassword2")?.value || "";
  const box = document.getElementById("newPasswordMessage");
  const say = (t, ok) => { if (box) { box.textContent = t; box.className = "auth-message " + (ok ? "success" : "error"); } };
  if (p1.length < 6) { say("Пароль должен содержать минимум 6 символов.", false); return; }
  if (p1 !== p2) { say("Пароли не совпадают.", false); return; }
  const { error } = await supabaseClient.auth.updateUser({ password: p1 });
  if (error) { say("Не удалось сохранить пароль: " + error.message, false); return; }
  say("Пароль изменён. Сейчас откроется платформа.", true);
  history.replaceState(null, "", window.location.pathname);
  setTimeout(() => location.reload(), 1000);
}

/* ============================================================
   АВТОВЫХОД ПОСЛЕ 1 ЧАСА БЕЗДЕЙСТВИЯ
   ============================================================ */
const INACTIVITY_LIMIT = 60 * 60 * 1000;
const LAST_ACTIVITY_KEY = "psychology_last_activity";
let inactivityTimer = null;
function updateLastActivity() {
  try { localStorage.setItem(LAST_ACTIVITY_KEY, Date.now().toString()); } catch (e) {}
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT);
}
async function autoLogoutAfterInactivity() {
  if (!window.currentUser) return;
  let last = 0;
  try { last = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0); } catch (e) {}
  if (!last) { updateLastActivity(); return; }
  const idle = Date.now() - last;
  if (idle >= INACTIVITY_LIMIT) { await logoutUser(); return; }
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(autoLogoutAfterInactivity, INACTIVITY_LIMIT - idle);
}
["click", "keydown", "scroll", "touchstart"].forEach(ev => document.addEventListener(ev, () => { if (window.currentUser) updateLastActivity(); }, { passive: true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoLogoutAfterInactivity(); });

async function logoutUser() {
  try { await supabaseClient.auth.signOut(); } catch (e) { console.error(e); }
  try { localStorage.removeItem(LAST_ACTIVITY_KEY); } catch (e) {}
  clearTimeout(inactivityTimer);
  window.currentUser = null;
  window.currentUserRole = "";
  showLogin();
}

/* ============================================================
   ЗАПУСК
   ============================================================ */
async function checkAuth() {
  try {
    if (window.location.hash.includes("type=recovery")) { showSetNewPasswordForm(); return; }
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) { showLogin("Не удалось проверить авторизацию."); return; }
    if (!session) { showLogin(); return; }

    const user = session.user;
    const { data: profile } = await supabaseClient.from("profiles")
      .select("role, first_name, last_name, email, status, teacher_id").eq("id", user.id).maybeSingle();

    if (profile?.status === "deleted") {
      await supabaseClient.auth.signOut();
      showLogin("Аккаунт отключён. Обратитесь к администратору.");
      return;
    }

    const role = String(profile?.role || "student");
    const { data: periods } = await supabaseClient.from("access_periods")
      .select("status, starts_at, ends_at, is_unlimited, payment_status, granted_scope, created_at")
      .eq("profile_id", user.id).order("created_at", { ascending: false });
    const latest = (periods || [])[0] || null;
    const active = (periods || []).filter(hasActivePlatformAccess);

    window.currentUser = user;
    window.currentUserId = user.id;
    window.currentUserRole = role;
    window.currentUserIsManager = role === "admin" || role === "teacher";
    window.currentUserGrant = active[0]?.granted_scope || {};
    window.currentUserAccessMeta = {
      isExpired: !!latest && !latest.is_unlimited && !hasActivePlatformAccess(latest),
      endsAt: latest?.ends_at || null
    };

    document.getElementById("logoSymbol").innerHTML = butterflySvg(72);
    document.getElementById("clientName").textContent = profile?.first_name || user.user_metadata?.first_name || (user.email || "").split("@")[0];
    document.getElementById("clientEmail").textContent = profile?.email || user.email || "";

    if (role === "student" && profile?.teacher_id) {
      supabaseClient.from("schools").select("name").eq("owner_id", profile.teacher_id).maybeSingle().then(({ data: school }) => {
        const line = document.getElementById("studentSchoolLine");
        if (line && school?.name) { line.textContent = "Школа: " + school.name; line.style.display = "block"; }
      });
    }

    renderNav();
    document.body.style.visibility = "visible";
    updateLastActivity();
    showHome();
  } catch (error) {
    console.error("Ошибка checkAuth:", error);
    showLogin("Не удалось подключиться к платформе. Проверьте интернет и попробуйте ещё раз.");
  }
}

document.addEventListener("DOMContentLoaded", checkAuth);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.error("Service Worker:", err));
  });
}
</script>
