<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь Пробуждения — игровая комната</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="icon" href="favicon.png?v=1">
<style>
:root {
  --page: #0B1530; --card: #16244D; --card2: #1B2B5A; --main: #0E1A3A;
  --line: rgba(244,165,130,.55); --line-soft: rgba(244,165,130,.25);
  --coral: #F4A582; --coral2: #E8826A; --cream: #FCE3D6; --text: #DCE2F4; --muted: #8C97B8;
  --ok: #8fe3b0; --bad: #ff9d9d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); font-family: Arial, sans-serif; }
body { font-variant-numeric: lining-nums; }
button, input, textarea { font: inherit; }
h1, h2, h3 { font-family: "PT Serif", Georgia, serif; font-weight: 400; color: var(--cream); }
.wrap { max-width: 1400px; margin: 0 auto; padding: 14px 16px 30px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 24px; }
.brand small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: linear-gradient(135deg, var(--coral), var(--coral2)); color: #1A1430; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--cream); font-weight: 400; }
.btn-small { padding: 7px 12px; font-size: 14px; }
.input { width: 100%; background: var(--main); border: 1px solid var(--line-soft); color: var(--text); border-radius: 10px; padding: 10px 12px; }
.input:focus { outline: none; border-color: var(--coral); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.panel { background: linear-gradient(145deg, var(--card2), var(--card)); border: 1px solid var(--line-soft); border-radius: 18px; padding: 16px; }
.panel h3 { margin: 0 0 10px; font-size: 18px; color: var(--coral); }
.side { display: flex; flex-direction: column; gap: 14px; }
.board-panel { padding: 10px; }
#board svg { width: 100%; height: auto; display: block; max-height: 86vh; }
.cell { cursor: pointer; transition: opacity .2s; }
.cell:hover { opacity: .8; }
.token { transition: transform .6s ease; }
.turn-box { display: flex; align-items: center; gap: 12px; }
.chip { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1A1430; font-weight: 700; flex-shrink: 0; border: 2px solid rgba(255,255,255,.7); }
.chip.big { width: 46px; height: 46px; font-size: 20px; }
.dice-row { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.dice { font-size: 54px; line-height: 1; color: var(--cream); width: 60px; text-align: center; }
.dice.spin { animation: spin .6s ease; }
@keyframes spin { from { transform: rotate(0) scale(.6); } to { transform: rotate(720deg) scale(1); } }
.msg-line { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 18px; line-height: 1.45; }
.players { display: flex; flex-direction: column; gap: 8px; }
.player { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 12px; border: 1px solid transparent; }
.player.active { border-color: var(--coral); background: rgba(244,165,130,.08); }
.player .pname { color: var(--cream); font-weight: 700; }
.player .pquery { color: var(--muted); font-size: 13px; font-style: italic; margin-top: 2px; }
.player .pinfo { font-size: 12px; margin-top: 4px; }
.player .x { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.form-row { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.log { max-height: 220px; overflow-y: auto; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 5px; }
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4,8,22,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: 600px; max-width: 100%; max-height: 92vh; overflow-y: auto; background: linear-gradient(145deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: 0 20px 70px rgba(0,0,0,.5); }
.modal h2 { margin: 4px 0 6px; font-size: 26px; }
.modal .lvl { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 13px; color: #1A1430; font-weight: 700; }
.modal .sub { color: var(--coral); font-weight: 700; margin: 14px 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
.modal p { line-height: 1.6; margin: 4px 0; }
.modal .note { background: rgba(244,165,130,.1); border-left: 3px solid var(--coral); padding: 8px 12px; border-radius: 8px; margin-top: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.who-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.center-msg { max-width: 520px; margin: 60px auto; text-align: center; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 60; }
.call-btn { background: #2D8CFF; color: #fff; border-color: #2D8CFF; }
.print-area { display: none; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; }
}
@media print {
  @page { size: A4; margin: 14mm; }
  body { background: #fff; color: #222; }
  .wrap, .overlay, .toast { display: none !important; }
  .print-area { display: block !important; color: #222; font-size: 12pt; line-height: 1.5; }
  .print-area h1, .print-area h2, .print-area h3 { color: #1B2B5A; }
  .print-area .pcard { border-left: 3px solid #E8826A; padding-left: 10px; margin: 8px 0 12px; break-inside: avoid; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center-msg">Загрузка комнаты…</div></div>
<div class="print-area" id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="awakening-data.js?v=1"></script>
<script src="room-chat.js?v=1"></script>
<script>
const SUPABASE_URL = "https://kfsyeejdwrcmwqacmigb.supabase.co";
const SUPABASE_KEY = "sb_publishable_4osUqgFDEHZ99UhULjHLIQ_M1vYSDe0";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ROOM = new URLSearchParams(location.search).get("room") || "";
const ME_KEY = "awk_me_" + ROOM, SEEN_KEY = "awk_seen_" + ROOM;
const COLORS = ["#F4A582", "#7FC8E8", "#8fe3b0", "#F2D16B", "#C49BF0", "#F07A8A", "#FFFFFF", "#5DCB8A"];
const DICE = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
const NS = AWK_SPHERES.length;

let room = null;          // {id,title,call_url,state,version,is_host}
let me = null;            // {pid?, name}
let channel = null;
let busy = false;

/* ---------- утилиты ---------- */
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function $(id) { return document.getElementById(id); }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function loadMe() { try { return JSON.parse(localStorage.getItem(ME_KEY)); } catch (e) { return null; } }
function saveMe() { try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {} }
function seenSeq() { try { return +localStorage.getItem(SEEN_KEY) || 0; } catch (e) { return 0; } }
function setSeen(n) { try { localStorage.setItem(SEEN_KEY, String(n)); } catch (e) {} }
function st() { return room.state; }
function chakra(level) { return AWK_CHAKRAS[level - 1]; }
function cardOf(level, sector) { return AWK_CARDS[AWK_SPHERES[sector].id][level - 1]; }
function playerById(pid) { return (st().players || []).find(p => p.id === pid); }
function myPlayer() { return me && me.pid ? playerById(me.pid) : null; }
function current() { const s = st(); return s.status === "playing" ? s.players[s.turn] : null; }
function myName() { return room.is_host ? (me && me.name ? me.name + " (ведущий)" : "Ведущий") : (me ? me.name : "Гость"); }
function timeStr(iso) { const d = new Date(iso); return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
function rid() { return Math.random().toString(36).slice(2, 10); }

function normState(s) {
  s = s && typeof s === "object" ? s : {};
  if (!s.status) s.status = "lobby";
  if (!Array.isArray(s.players)) s.players = [];
  if (!Array.isArray(s.log)) s.log = [];
  if (typeof s.turn !== "number") s.turn = 0;
  if (typeof s.seq !== "number") s.seq = 0;
  return s;
}

/* ---------- загрузка и сохранение ---------- */
async function fetchRoom() {
  const { data, error } = await sb.rpc("awk_get_room", { p_room: ROOM });
  if (error || !data) return null;
  data.state = normState(data.state);
  return data;
}

// Изменение состояния: всегда поверх свежей версии, с защитой от одновременных ходов
async function commit(mutator) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const fresh = await fetchRoom();
    if (!fresh) { toast("Нет связи с комнатой"); return false; }
    const s = JSON.parse(JSON.stringify(fresh.state));
    const res = mutator(s);
    if (res === false) { room = fresh; render(); return false; }
    const { data, error } = await sb.rpc("awk_save_state", { p_room: ROOM, p_state: s, p_version: fresh.version });
    if (error) { toast("Не удалось сохранить: " + error.message); return false; }
    if (data >= 0) {
      fresh.state = normState(s); fresh.version = data; room = fresh;
      channel && channel.send({ type: "broadcast", event: "state", payload: { v: data } });
      render(); checkCard();
      return true;
    }
    await sleep(300);
  }
  toast("Кто-то ходит одновременно с вами — попробуйте ещё раз");
  return false;
}

async function refresh() {
  const fresh = await fetchRoom();
  if (!fresh) return;
  const changed = !room || fresh.version !== room.version || fresh.call_url !== room.call_url;
  room = fresh;
  if (changed) { render(); checkCard(); }
}

function loadMessages() { return RoomChat.load(); }

/* ---------- логика игры ---------- */
function addLog(s, text) { s.log.push({ t: Date.now(), text }); if (s.log.length > 200) s.log = s.log.slice(-200); }

function nextTurn(s) {
  const n = s.players.length;
  if (s.players.every(p => p.done)) { s.status = "over"; return; }
  let i = s.turn;
  for (let k = 0; k < n; k++) { i = (i + 1) % n; if (!s.players[i].done) { s.turn = i; return; } }
}

function riseLevel(s, p, why, showLotus) {
  if (p.level >= 7) {
    p.done = true; p.level = 8;
    p.path.push({ level: 8, sector: p.sector, kind: "lotus", t: Date.now() });
    addLog(s, `🪷 ${p.name} достигает Лотоса пробуждения (${why})`);
    if (showLotus) { s.seq++; s.last = { seq: s.seq, pid: p.id, level: 8, sector: p.sector, kind: "lotus" }; }
    return true;
  }
  p.level++;
  addLog(s, `⬆ ${p.name} поднимается на ${chakra(p.level).name} (${why})`);
  return false;
}

async function roll() {
  if (busy) return;
  const cur = current();
  if (!cur) return;
  if (st().pendingFear) { toast("Сначала нужно завершить клетку «Страх»"); return; }
  if (!(room.is_host || (me && me.pid === cur.id))) { toast("Сейчас ход другого игрока"); return; }
  busy = true; renderControls();
  const d = 1 + Math.floor(Math.random() * 6);
  const dice = $("dice"); if (dice) { dice.classList.remove("spin"); void dice.offsetWidth; dice.classList.add("spin"); dice.textContent = DICE[d]; }
  await sleep(650);
  await commit(s => {
    if (s.status !== "playing" || s.pendingFear) return false;
    const p = s.players[s.turn];
    if (!p || p.id !== cur.id) return false;
    s.lastRoll = d;
    let sec = p.sector + d, lotus = false;
    addLog(s, `🎲 ${p.name}: выпало ${d}`);
    if (sec >= NS) { sec -= NS; p.sector = sec; lotus = riseLevel(s, p, "пройден полный круг", true); }
    p.sector = sec;
    if (lotus) { nextTurn(s); return; }
    const sph = AWK_SPHERES[sec];
    p.path.push({ level: p.level, sector: sec, roll: d, kind: "card", t: Date.now() });
    s.seq++; s.last = { seq: s.seq, pid: p.id, level: p.level, sector: sec, kind: "card", roll: d };
    addLog(s, `${sph.icon} ${p.name} → ${sph.name} · ${chakra(p.level).name}`);
    if (sph.special === "shield") {
      if (!p.shield) addLog(s, `🛡️ ${p.name} получает щит`);
      p.shield = true; s.last.note = "shield";
    } else if (sph.special === "fear") {
      if (p.shield) { p.shield = false; s.last.note = "shielded"; addLog(s, `🛡️ Щит защитил ${p.name} от спуска`); }
      else if (p.level > 1) { s.pendingFear = p.id; s.last.note = "fear"; return; }
      else s.last.note = "fear1";
    } else if (sph.special === "rise") {
      s.last.note = "rise";
      if (riseLevel(s, p, sph.name, false)) { s.last.note = "rise-lotus"; }
    }
    nextTurn(s);
  });
  busy = false; renderControls();
}

async function resolveFear(stay) {
  await commit(s => {
    const p = s.players.find(x => x.id === s.pendingFear);
    if (!s.pendingFear || !p) return false;
    if (stay) addLog(s, `🔥 ${p.name} прорабатывает страх и остаётся на ${chakra(p.level).name}`);
    else { p.level = Math.max(1, p.level - 1); addLog(s, `⬇ ${p.name} спускается на ${chakra(p.level).name}`); }
    p.path.push({ level: p.level, sector: p.sector, kind: stay ? "fear-stay" : "fear-down", t: Date.now() });
    s.pendingFear = null;
    nextTurn(s);
  });
  closeModal();
}

/* ---------- участники ---------- */
async function joinGame() {
  const name = $("jName").value.trim(), query = ($("jQuery") ? $("jQuery").value.trim() : "");
  if (!name) { toast("Впишите имя"); return; }
  const asPlayer = st().status === "lobby" && !room.is_host;
  if (!asPlayer) { me = { name }; saveMe(); render(); return; }
  if (!query) { toast("Впишите свой запрос"); return; }
  const pid = rid();
  const ok = await commit(s => {
    if (s.status !== "lobby") return false;
    if (s.players.length >= 8) { toast("В комнате уже 8 игроков"); return false; }
    s.players.push(newPlayer(s, pid, name, query));
    addLog(s, `👋 ${name} присоединяется к игре`);
  });
  if (ok) { me = { pid, name }; saveMe(); render(); }
}

function newPlayer(s, id, name, query) {
  const used = s.players.map(p => p.color);
  const color = COLORS.find(c => !used.includes(c)) || COLORS[s.players.length % COLORS.length];
  return { id, name: name.slice(0, 40), query: query.slice(0, 300), color, level: 1, sector: 0, shield: false, done: false, path: [] };
}

async function hostAddPlayer() {
  const name = $("hName").value.trim(), query = $("hQuery").value.trim();
  if (!name) { toast("Впишите имя игрока"); return; }
  await commit(s => {
    if (s.status === "over") return false;
    if (s.players.length >= 8) { toast("Максимум 8 игроков"); return false; }
    s.players.push(newPlayer(s, rid(), name, query));
    addLog(s, `👋 Ведущий добавляет игрока ${name}`);
  });
}

async function removePlayer(pid) {
  if (!confirm("Убрать игрока из игры?")) return;
  await commit(s => {
    const i = s.players.findIndex(p => p.id === pid); if (i < 0) return false;
    const [p] = s.players.splice(i, 1);
    if (s.pendingFear === pid) s.pendingFear = null;
    if (s.status === "playing") { if (s.turn >= s.players.length) s.turn = 0; if (s.turn > i) s.turn--; if (s.players.length && s.players[s.turn].done) nextTurn(s); if (!s.players.length) s.status = "lobby"; }
    addLog(s, `${p.name} выходит из игры`);
  });
}

async function startGame() {
  await commit(s => {
    if (!s.players.length) { toast("Добавьте хотя бы одного игрока"); return false; }
    s.status = "playing"; s.turn = 0;
    s.players.forEach(p => { p.level = 1; p.sector = 0; p.shield = false; p.done = false; p.path = []; });
    addLog(s, "✨ Игра началась! Все игроки стоят на Муладхаре в сфере «Защита»");
  });
}

async function finishGame() {
  if (!confirm("Завершить игру для всех?")) return;
  await commit(s => { s.status = "over"; s.pendingFear = null; addLog(s, "Ведущий завершил игру"); });
}

async function setCall() {
  const url = prompt("Ссылка на звонок (Zoom, Google Meet и т.п.):", room.call_url || "");
  if (url === null) return;
  if (url && !/^https?:\/\//i.test(url.trim())) { toast("Ссылка должна начинаться с https://"); return; }
  const { error } = await sb.rpc("awk_set_call", { p_room: ROOM, p_url: url });
  if (error) { toast("Не удалось сохранить ссылку"); return; }
  room.call_url = url.trim() || null; render();
  channel && channel.send({ type: "broadcast", event: "state", payload: {} });
}

function copyInvite() {
  const link = location.origin + location.pathname + "?room=" + ROOM;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast("Ссылка скопирована — отправьте её игрокам"), () => prompt("Скопируйте ссылку:", link));
}

/* ---------- поле ---------- */
const R0 = 92, RW = 48, ROUT = R0 + 7 * RW;
function ringInner(level) { return R0 + (7 - level) * RW; }
function angOf(i) { return (-90 - 180 / NS + i * 360 / NS) * Math.PI / 180; }
function pt(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }
function cellPath(level, i) {
  const r1 = ringInner(level), r2 = r1 + RW, a1 = angOf(i), a2 = angOf(i + 1);
  const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2), [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1);
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r2},${r2} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} L${x3.toFixed(1)},${y3.toFixed(1)} A${r1},${r1} 0 0 0 ${x4.toFixed(1)},${y4.toFixed(1)} Z`;
}
function cellCenter(level, i) { return pt(ringInner(level) + RW / 2, angOf(i + .5)); }

function boardSvg() {
  let cells = "";
  for (let lv = 1; lv <= 7; lv++) {
    const c = chakra(lv).color;
    for (let i = 0; i < NS; i++) {
      const sp = AWK_SPHERES[i].special;
      const op = sp === "fear" ? .16 : sp === "rise" ? .5 : (i % 2 ? .27 : .36);
      cells += `<path class="cell" d="${cellPath(lv, i)}" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-opacity=".75" stroke-width="1.2" onclick="showInfo(${lv},${i})"><title>${esc(AWK_SPHERES[i].name)} · ${esc(chakra(lv).name)}</title></path>`;
      const [x, y] = cellCenter(lv, i);
      cells += `<text x="${x.toFixed(1)}" y="${(y + 6).toFixed(1)}" text-anchor="middle" font-size="${lv > 5 ? 15 : 19}" pointer-events="none" opacity=".85">${AWK_SPHERES[i].icon}</text>`;
    }
  }
  let labels = "";
  for (let i = 0; i < NS; i++) {
    const [x, y] = pt(ROUT + 18, angOf(i + .5));
    const anchor = Math.abs(x) < 40 ? "middle" : x > 0 ? "start" : "end";
    const words = AWK_SPHERES[i].name.split(" ");
    const lines = words.length > 1 && AWK_SPHERES[i].name.length > 11 ? [words.slice(0, -1).join(" "), words[words.length - 1]] : [AWK_SPHERES[i].name];
    labels += `<text x="${x.toFixed(1)}" y="${(y + 8 - (lines.length - 1) * 12).toFixed(1)}" text-anchor="${anchor}" font-size="23" fill="#FCE3D6">${lines.map((l, k) => `<tspan x="${x.toFixed(1)}" dy="${k ? 25 : 0}">${esc(l)}</tspan>`).join("")}</text>`;
  }
  // лотос в центре
  let petals = "";
  for (let k = 0; k < 8; k++) petals += `<ellipse cx="0" cy="-38" rx="16" ry="40" fill="url(#petal)" transform="rotate(${k * 45})" opacity=".9"/>`;
  return `<svg viewBox="-690 -500 1380 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow"><stop offset="0" stop-color="#A065D8" stop-opacity=".55"/><stop offset="1" stop-color="#A065D8" stop-opacity="0"/></radialGradient>
      <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FCE3D6"/><stop offset="1" stop-color="#C49BF0"/></linearGradient>
    </defs>
    <circle r="${ROUT + 8}" fill="none" stroke="#F4A582" stroke-opacity=".5" stroke-width="2"/>
    ${cells}${labels}
    <circle r="${R0 - 2}" fill="url(#glow)" class="cell" onclick="showLotus()"/>
    <g pointer-events="none">${petals}<circle r="14" fill="#F2D16B"/></g>
    <g id="tokens">${tokensSvg()}</g>
  </svg>`;
}

function tokensSvg() {
  const s = st(); const groups = {};
  s.players.forEach(p => { const key = p.done ? "lotus" : p.level + ":" + p.sector; (groups[key] = groups[key] || []).push(p); });
  let out = "";
  Object.entries(groups).forEach(([key, ps]) => {
    ps.forEach((p, k) => {
      let x, y;
      if (key === "lotus") { const a = (k / Math.max(ps.length, 1)) * Math.PI * 2; x = Math.cos(a) * 50; y = Math.sin(a) * 50; }
      else {
        [x, y] = cellCenter(p.level, p.sector);
        const n = ps.length; if (n > 1) { const a = (k / n) * Math.PI * 2; x += Math.cos(a) * 15; y += Math.sin(a) * 15; }
      }
      const active = s.status === "playing" && s.players[s.turn] && s.players[s.turn].id === p.id;
      out += `<g class="token" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" pointer-events="none">
        ${active ? `<circle r="21" fill="none" stroke="#FCE3D6" stroke-width="3"><animate attributeName="r" values="17;23;17" dur="1.6s" repeatCount="indefinite"/></circle>` : ""}
        <circle r="15" fill="${p.color}" stroke="#0B1530" stroke-width="3"/>
        <text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#1A1430">${esc(p.name.charAt(0).toUpperCase())}</text>
        ${p.shield ? `<text x="14" y="-10" font-size="13">🛡️</text>` : ""}
      </g>`;
    });
  });
  return out;
}

/* ---------- отрисовка ---------- */
function render() {
  if (!room) return;
  const keep = {};
  ["jName", "jQuery", "hName", "hQuery"].forEach(id => { const el = $(id); if (el) keep[id] = el.value; });
  const focusId = document.activeElement && document.activeElement.id;
  const detOpen = !!document.querySelector("details[open]");
  renderInner();
  Object.entries(keep).forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
  if (detOpen) { const d = document.querySelector("details"); if (d) d.open = true; }
  if (focusId && $(focusId)) $(focusId).focus();
}
function renderInner() {
  const s = st();
  const joined = room.is_host || (me && (me.pid ? !!myPlayer() : !!me.name));
  $("app").innerHTML = `
    <div class="topbar">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 14 C15 5 6 9 8.5 18 C10 23.5 16 23.5 22 22 Z" fill="#F4A582"/><path d="M22 14 C29 5 38 9 35.5 18 C34 23.5 28 23.5 22 22 Z" fill="#F4A582"/><path d="M22 22 C16 23 11.5 27.5 13.5 32.5 C15.5 36 20 31.5 22 26 Z" fill="#E8826A"/><path d="M22 22 C28 23 32.5 27.5 30.5 32.5 C28.5 36 24 31.5 22 26 Z" fill="#E8826A"/><path d="M22 13 L22 32" stroke="#FCE3D6" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div><small>PSYCHOLOGY Platform</small><h1>Путь Пробуждения</h1></div>
      </div>
      <div class="top-actions">
        ${room.call_url ? `<a class="btn btn-small call-btn" href="${esc(room.call_url)}" target="_blank" rel="noopener">🎥 Войти в звонок</a>` : ""}
        ${room.is_host ? `<button class="btn btn-ghost btn-small" onclick="copyInvite()">🔗 Пригласить игроков</button>
          <button class="btn btn-ghost btn-small" onclick="setCall()">🎥 ${room.call_url ? "Изменить" : "Добавить"} ссылку на звонок</button>` : ""}
        <button class="btn btn-ghost btn-small" onclick="showRules()">📖 Правила</button>
        ${s.players.some(p => p.path.length) ? `<button class="btn btn-ghost btn-small" onclick="showSummary()">📜 Путь игроков</button>` : ""}
        ${room.is_host && s.status === "playing" ? `<button class="btn btn-ghost btn-small" onclick="finishGame()">Завершить игру</button>` : ""}
      </div>
    </div>
    <div class="layout">
      <div class="panel board-panel"><div id="board">${boardSvg()}</div>
        <div class="legend">${AWK_CHAKRAS.map(c => `<span style="--c:${c.color}">${c.n}. ${esc(c.name)}</span>`).join("")}<span style="--c:#FCE3D6">🪷 Лотос — финиш</span></div>
      </div>
      <div class="side">
        <div class="panel" id="controls"></div>
        <div class="panel"><h3>Игроки</h3><div class="players" id="players"></div>${joinBlock(joined)}${hostAddBlock()}</div>
        <div id="chatSlot"></div>
        <div class="panel"><h3>Ход игры</h3><div class="log" id="log"></div></div>
      </div>
    </div>`;
  renderPlayers(); renderControls(); renderLog();
  RoomChat.setCanWrite(!!joined);
  $("chatSlot").replaceWith(RoomChat.el);
}

function joinBlock(joined) {
  if (joined) return "";
  const lobby = st().status === "lobby";
  return `<div class="form-row">
    <b style="color:var(--cream);">${lobby ? "Присоединиться к игре" : "Войти в комнату"}</b>
    <input id="jName" class="input" maxlength="40" placeholder="Ваше имя">
    ${lobby ? `<textarea id="jQuery" class="input" rows="2" maxlength="300" placeholder="Ваш запрос: «Как мне…», «Что мне важно понять о…»"></textarea>` : `<p class="msg-line" style="margin:0;">Игра уже идёт — вы можете наблюдать и писать в чат</p>`}
    <button class="btn" onclick="joinGame()">${lobby ? "Присоединиться" : "Войти"}</button>
  </div>`;
}
function hostAddBlock() {
  if (!room.is_host || st().status === "over") return "";
  return `<details style="margin-top:10px;"><summary style="cursor:pointer;color:var(--coral);">+ Добавить игрока вручную</summary>
    <div class="form-row"><input id="hName" class="input" maxlength="40" placeholder="Имя игрока">
    <textarea id="hQuery" class="input" rows="2" maxlength="300" placeholder="Запрос игрока"></textarea>
    <button class="btn btn-small" onclick="hostAddPlayer()">Добавить</button></div></details>`;
}

function renderPlayers() {
  const s = st(), el = $("players"); if (!el) return;
  el.innerHTML = s.players.length ? s.players.map((p, i) => `
    <div class="player${s.status === "playing" && i === s.turn ? " active" : ""}">
      <div class="chip" style="background:${p.color};">${esc(p.name.charAt(0).toUpperCase())}</div>
      <div style="min-width:0;flex:1;">
        <div class="pname">${esc(p.name)}${me && me.pid === p.id ? " <span style='color:var(--muted);font-weight:400;'>(вы)</span>" : ""}</div>
        ${p.query ? `<div class="pquery">«${esc(p.query)}»</div>` : ""}
        <div class="pinfo" style="color:${p.done ? "var(--ok)" : chakra(Math.min(p.level, 7)).color};">${p.done ? "🪷 Достиг(ла) Лотоса" : `${p.level}. ${chakra(p.level).name} · ${AWK_SPHERES[p.sector].name}`}${p.shield ? " · 🛡️ щит" : ""}</div>
      </div>
      ${room.is_host && s.status !== "over" ? `<button class="x" title="Убрать" onclick="removePlayer('${p.id}')">×</button>` : ""}
    </div>`).join("") : `<p class="msg-line" style="margin:0;">Пока никто не присоединился. ${room.is_host ? "Отправьте игрокам ссылку-приглашение или добавьте их вручную." : ""}</p>`;
}

function renderControls() {
  const s = st(), el = $("controls"); if (!el) return;
  if (s.status === "lobby") {
    el.innerHTML = `<h3>Ожидание игроков</h3>
      <p class="msg-line" style="margin-top:0;">${room.is_host ? "Когда все игроки присоединятся, нажмите «Начать игру»." : "Ведущий скоро начнёт игру. Пока можно познакомиться в чате."}</p>
      ${room.is_host ? `<button class="btn" style="width:100%;margin-top:6px;" onclick="startGame()" ${s.players.length ? "" : "disabled"}>✨ Начать игру</button>` : ""}`;
    return;
  }
  if (s.status === "over") {
    el.innerHTML = `<h3>Игра завершена</h3><p class="msg-line" style="margin-top:0;">Спасибо за путь! Итоги каждого игрока — в «Путь игроков».</p>
      <button class="btn" style="width:100%;margin-top:6px;" onclick="showSummary()">📜 Итоги игры</button>`;
    return;
  }
  const p = current();
  const canRoll = !busy && !s.pendingFear && (room.is_host || (me && p && me.pid === p.id));
  const fearP = s.pendingFear ? playerById(s.pendingFear) : null;
  el.innerHTML = `
    <div class="turn-box"><div class="chip big" style="background:${p.color};">${esc(p.name.charAt(0).toUpperCase())}</div>
      <div><div style="color:var(--muted);font-size:13px;">Сейчас ходит</div><div style="color:var(--cream);font-size:20px;font-family:'PT Serif',serif;">${esc(p.name)}</div></div></div>
    <div class="dice-row"><div class="dice" id="dice">${DICE[s.lastRoll || 6]}</div>
      <button class="btn" style="flex:1;" onclick="roll()" ${canRoll ? "" : "disabled"}>🎲 Бросить кубик</button></div>
    <div class="msg-line">${fearP ? `🔥 ${esc(fearP.name)} на клетке «Страх» — ожидаем решения` : canRoll ? (room.is_host && me?.pid !== p.id ? "Вы ведущий: можете бросить кубик за игрока" : "Ваш ход!") : "Ждём хода игрока"}</div>
    ${s.last ? `<button class="btn btn-ghost btn-small" style="margin-top:8px;" onclick="showLast()">Открыть последнюю карточку</button>` : ""}`;
}

function renderLog() {
  const el = $("log"); if (!el) return;
  el.innerHTML = st().log.slice().reverse().map(l => `<div>${esc(l.text)}</div>`).join("") || "<div>Здесь появится история ходов</div>";
}

/* ---------- карточки ---------- */
function closeModal() { const o = $("overlay"); if (o) o.remove(); }
function modal(html) {
  closeModal();
  const o = document.createElement("div"); o.className = "overlay"; o.id = "overlay";
  o.innerHTML = `<div class="modal">${html}</div>`;
  o.addEventListener("click", e => { if (e.target === o && !o.dataset.lock) closeModal(); });
  document.body.appendChild(o); return o;
}

function cardHtml(level, sector, p) {
  const ch = chakra(level), sp = AWK_SPHERES[sector], c = cardOf(level, sector);
  return `${p ? `<div class="who-line"><div class="chip" style="background:${p.color};width:26px;height:26px;font-size:13px;">${esc(p.name.charAt(0).toUpperCase())}</div>${esc(p.name)}${p.query ? ` · <i>«${esc(p.query)}»</i>` : ""}</div>` : ""}
    <div style="margin-top:10px;"><span class="lvl" style="background:${ch.color};">${ch.n}. ${esc(ch.name)} — ${esc(ch.theme)}</span></div>
    <h2>${sp.icon} ${esc(sp.name)}</h2>
    <p>${esc(c[0])}</p>
    <div class="sub">Вопрос к запросу</div><p>${esc(c[1])}</p>
    <div class="sub">Практика</div><p>${esc(c[2])}</p>`;
}

function showInfo(level, sector) {
  modal(`${cardHtml(level, sector, null)}<div class="note">${esc(AWK_SPHERES[sector].about)}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`);
}

function lotusHtml(p) {
  return `${p ? `<div class="who-line"><div class="chip" style="background:${p.color};width:26px;height:26px;font-size:13px;">${esc(p.name.charAt(0).toUpperCase())}</div>${esc(p.name)}${p.query ? ` · <i>«${esc(p.query)}»</i>` : ""}</div>` : ""}
    <h2>🪷 ${esc(AWK_LOTUS.name)}</h2><p>${esc(AWK_LOTUS.text)}</p>
    <div class="sub">Вопросы для итога</div><ul>${AWK_LOTUS.q.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    <div class="sub">Практика</div><p>${esc(AWK_LOTUS.practice)}</p>`;
}
function showLotus() { modal(`${lotusHtml(null)}<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`); }

const NOTES = {
  shield: "🛡️ Вы получаете щит. Он один раз защитит от спуска на клетке «Страх».",
  shielded: "🛡️ Щит защитил вас: вы остаётесь на этой чакре. Но на вопрос о страхе всё равно стоит ответить.",
  fear1: "Вы на первой чакре — ниже спускаться некуда. Ответьте на вопрос о своём страхе.",
  rise: "Ресурсная клетка! После карточки вы поднимаетесь на следующую чакру.",
  "rise-lotus": "Ресурсная клетка привела вас в центр — к Лотосу пробуждения!"
};

function showLast() {
  const s = st(), L = s.last; if (!L) return;
  const p = playerById(L.pid);
  if (L.kind === "lotus") { modal(`${lotusHtml(p)}<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`); return; }
  const fearPending = s.pendingFear && s.pendingFear === L.pid && L.note === "fear";
  const canDecide = fearPending && (room.is_host || (me && me.pid === L.pid));
  const o = modal(`${cardHtml(L.level, L.sector, p)}
    ${L.roll ? `<p style="color:var(--muted);font-size:13px;margin-top:10px;">Выпало на кубике: ${L.roll}</p>` : ""}
    ${L.note && NOTES[L.note] ? `<div class="note">${NOTES[L.note]}</div>` : ""}
    ${fearPending ? `<div class="note">🔥 Клетка «Страх». Ответьте на вопрос о страхе. Если страх проработан — вы остаётесь на этой чакре. Если вы пока не готовы на него посмотреть — спускаетесь на чакру ниже.</div>` : ""}
    <div class="modal-actions">
      ${canDecide ? `<button class="btn btn-ghost" onclick="resolveFear(false)">⬇ Спуститься на чакру ниже</button><button class="btn" onclick="resolveFear(true)">Страх проработан — остаюсь</button>`
        : fearPending ? `<span class="msg-line">Ждём решения игрока…</span><button class="btn btn-ghost" onclick="closeModal()">Свернуть</button>`
        : `<button class="btn" onclick="closeModal()">Закрыть</button>`}
    </div>`);
  if (canDecide) o.dataset.lock = "1";
}

function checkCard() {
  const L = st().last;
  if (L && L.seq > seenSeq()) { setSeen(L.seq); showLast(); }
}

function showRules() {
  modal(`<h2>📖 Правила игры</h2><ol>${AWK_RULES.map(r => `<li style="margin-bottom:6px;line-height:1.5;">${esc(r)}</li>`).join("")}</ol>
    <div class="sub">Чакры</div>${AWK_CHAKRAS.map(c => `<p><b style="color:${c.color};">${c.n}. ${esc(c.name)}</b> — ${esc(c.theme)}</p>`).join("")}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Понятно</button></div>`);
}

/* ---------- итоги ---------- */
function stepTitle(x) {
  if (x.kind === "lotus") return "🪷 Лотос пробуждения";
  if (x.kind === "fear-stay") return "🔥 Страх проработан — остался(ась) на " + chakra(x.level).name;
  if (x.kind === "fear-down") return "⬇ Спуск на " + chakra(x.level).name;
  return `${AWK_SPHERES[x.sector].icon} ${AWK_SPHERES[x.sector].name} · ${chakra(x.level).name}${x.roll ? ` (кубик: ${x.roll})` : ""}`;
}
function summaryHtml(forPrint) {
  return st().players.map(p => `
    <div style="margin-bottom:22px;">
      <h3 style="margin:0 0 4px;">${esc(p.name)}${p.done ? " — 🪷 дошёл(ла) до Лотоса" : ` — ${chakra(p.level).name}`}</h3>
      ${p.query ? `<p style="margin:0 0 8px;"><i>Запрос: «${esc(p.query)}»</i></p>` : ""}
      ${p.path.length ? p.path.map(x => forPrint && x.kind === "card" ? `<div class="pcard"><b>${esc(stepTitle(x))}</b><br>${esc(cardOf(x.level, x.sector)[0])}<br><i>${esc(cardOf(x.level, x.sector)[1])}</i></div>` : `<div style="font-size:14px;margin:3px 0;">${esc(stepTitle(x))}</div>`).join("") : "<p>Ходов ещё не было</p>"}
    </div>`).join("");
}
function showSummary() {
  modal(`<h2>📜 Путь игроков</h2>${summaryHtml(false)}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="printSummary()">⬇ Скачать PDF</button><button class="btn" onclick="closeModal()">Закрыть</button></div>`);
}
function printSummary() {
  $("printArea").innerHTML = `<h1>Путь Пробуждения — итоги игры</h1><p>${new Date().toLocaleDateString("ru-RU")}</p>${summaryHtml(true)}
    <p style="margin-top:20px;font-size:10pt;color:#777;">PSYCHOLOGY Platform</p>`;
  const old = document.title; document.title = "Путь Пробуждения — итоги игры " + new Date().toLocaleDateString("ru-RU");
  window.print(); setTimeout(() => { document.title = old; }, 1000);
}

/* ---------- запуск ---------- */
async function init() {
  if (!/^[0-9a-f-]{36}$/i.test(ROOM)) { $("app").innerHTML = `<div class="center-msg"><h2>Комната не найдена</h2><p>Проверьте ссылку-приглашение.</p></div>`; return; }
  me = loadMe();
  room = await fetchRoom();
  if (!room) { $("app").innerHTML = `<div class="center-msg"><h2>Комната не найдена</h2><p>Возможно, ведущий удалил эту игру. Проверьте ссылку-приглашение.</p></div>`; return; }
  if (room.is_host && !me) me = { name: "" };
  RoomChat.init({ sb, room: ROOM, title: "Путь Пробуждения — чат игры", canExport: !!room.can_export, getName: myName, toast,
    notify: () => channel && channel.send({ type: "broadcast", event: "msg", payload: {} }) });
  render();
  await loadMessages();
  // если открыли впервые — не показываем старую карточку
  if (st().last && !seenSeq()) setSeen(st().last.seq);
  channel = sb.channel("awk-" + ROOM, { config: { broadcast: { self: false } } })
    .on("broadcast", { event: "state" }, () => refresh())
    .on("broadcast", { event: "msg" }, () => loadMessages())
    .subscribe();
  setInterval(() => { refresh(); loadMessages(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); loadMessages(); } });
}
init();
</script>
</body>
</html>
